  <style>
    /* Cores explícitas + color-scheme fixo: o modo escuro automático do celular não inverte nada. */
    :root, html, body { color-scheme: light only; }
    :root {
      --bg:      #050505;
      --panel:   #101014;
      --line:    #24232b;
      --fg:      #ffffff;
      --mute:    #a19dab;
      --pink:    #EE2A7B;
      --pink-hi: #ff5c9d;
      --display: "Montserrat", "Arial Black", system-ui, sans-serif;
      --body:    "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      font-family: var(--body); background: var(--bg); color: var(--fg);
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
      position: relative;
    }
    body::before {
      content: ""; position: fixed; left: 50%; top: -220px; transform: translateX(-50%);
      width: 720px; height: 560px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(238,42,123,.30), rgba(238,42,123,0));
      animation: pulseGlow 5s ease-in-out infinite; pointer-events: none;
    }

    .wrap { position: relative; width: 100%; max-width: 460px; padding: 56px 16px 32px; text-align: center; flex: 1; }
    .logo { height: 36px; width: auto; filter: brightness(0) invert(1); }

    .tag {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 30px;
      border: 1px solid rgba(238,42,123,.5); background: rgba(238,42,123,.10);
      color: var(--pink-hi); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      padding: 8px 16px; border-radius: 999px;
    }
    .tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pink); animation: blink 1.1s ease-in-out infinite; }

    h1 {
      font-family: var(--display); font-weight: 900; text-transform: uppercase;
      font-size: clamp(38px, 12vw, 56px); line-height: .98; letter-spacing: -.02em;
      margin-top: 18px;
    }
    h1 em {
      font-style: normal; display: block;
      background: linear-gradient(92deg, var(--pink) 10%, var(--pink-hi) 85%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .lead { margin: 16px auto 0; max-width: 360px; color: var(--mute); font-size: 15.5px; line-height: 1.6; }
    .lead b { color: #fff; font-weight: 600; }

    .links { display: grid; gap: 14px; margin-top: 34px; }

    /* Botão pill com glow e shine (padrão das LPs) */
    .btn {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px; border-radius: 999px;
      text-decoration: none; text-align: left; color: #fff;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .btn .ico { position: relative; z-index: 2; width: 44px; height: 44px; flex: 0 0 44px; border-radius: 50%; display: grid; place-items: center; }
    .btn .ico svg { width: 22px; height: 22px; }
    .btn .txt { position: relative; z-index: 2; flex: 1; line-height: 1.25; }
    .btn .txt strong { display: block; font-size: 16px; font-weight: 700; }
    .btn .txt small { display: block; font-size: 12.5px; opacity: .8; margin-top: 2px; }
    .btn .arr { position: relative; z-index: 2; width: 18px; height: 18px; flex: 0 0 18px; stroke: currentColor; stroke-width: 2.4; fill: none; }

    .btn-vip {
      background: radial-gradient(38.67% 91.17% at 50% 8.83%, var(--pink) 0, var(--pink-hi) 100%);
      box-shadow: 0 0 20px rgba(238,42,123,.5), 0 0 40px rgba(255,92,157,.35), 0 10px 25px rgba(238,42,123,.25);
    }
    .btn-vip .ico { background: rgba(255,255,255,.18); }
    .btn-vip .ico svg { fill: #fff; }
    .btn-vip::before {
      content: ''; position: absolute; bottom: 0; width: 90px; height: 160%;
      background: linear-gradient(10deg, #ffd9ec 12.81%, rgba(255,217,236,0) 66.66%);
      transform: translateX(-50%) skew(-25deg);
      animation: shinery 3s ease-in-out infinite; filter: blur(4px); pointer-events: none;
    }
    .btn-vip:hover, .btn-vip:focus-visible {
      transform: scale(1.02); outline: none;
      box-shadow: 0 0 25px rgba(238,42,123,.6), 0 0 60px rgba(255,92,157,.5), 0 15px 35px rgba(238,42,123,.3);
    }

    .btn-com { background: var(--panel); border: 1px solid var(--line); }
    .btn-com .ico { background: #25D366; }
    .btn-com .ico svg { fill: #fff; }
    .btn-com:hover, .btn-com:focus-visible { transform: scale(1.02); outline: none; border-color: rgba(238,42,123,.55); }

    .foot { position: relative; padding: 24px 16px 32px; color: #6b6875; font-size: 12px; text-align: center; }
    .foot a { color: var(--mute); }

    .fade { opacity: 0; animation: fadeSlideIn .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .05s } .d2 { animation-delay: .15s } .d3 { animation-delay: .25s } .d4 { animation-delay: .35s } .d5 { animation-delay: .45s }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
    @keyframes shinery { 0%, 100% { left: -10%; opacity: 0; } 10% { opacity: 1; } 50% { left: 110%; opacity: 1; } 51% { opacity: 0; } }
    @keyframes pulseGlow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; opacity: 1; }
      body::before, .btn-vip::before, .tag .dot { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo fade d1" src="https://odonconcursos.com.br/assets/img/logo.png" alt="OdonConcursos" />

        <span class="txt"><strong>Fale com o comercial</strong><small>Atendimento pelo WhatsApp</small></span>
        <svg class="arr" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </nav>
  </main>

  <footer class="foot">© OdonConcursos · <a href="https://odonconcursos.com.br" target="_blank" rel="noopener">odonconcursos.com.br</a></footer>

  <script>
    // Repassa UTMs/fbclid da bio para a lista VIP; WhatsApp do comercial com mensagem pronta.
    const qs = location.search;
    const vip = document.getElementById('vip');
    vip.href = '/lp/concurso/black-friday-lista-espera/' + qs;
    const com = document.getElementById('comercial');
    com.href = 'https://wa.me/5519994565534?text=' + encodeURIComponent('Olá! Vim pelo link da bio e quero saber mais sobre a Black November da Odon.');
    vip.addEventListener('click', () => { if (window.fbq) fbq('trackCustom', 'LinkClick', { content_name: 'Lista VIP Black November' }); });
    com.addEventListener('click', () => { if (window.fbq) fbq('track', 'Contact'); });
  </script>
</body>
</html>
