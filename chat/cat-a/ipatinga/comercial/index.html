  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    :root {
      --bg:#eef1f7; --bg-soft:#f1f3f9; --bg-card:#fff;
      --line:rgba(11,21,53,0.10); --line-strong:rgba(11,21,53,0.18);
      --text:#0b1535; --text-mute:#475569; --text-dim:#64748b; --text-faint:#94a3b8;
      --lime:#e91e8c; --lime-soft:#f472b6; --orange:#e91e8c; --orange-2:#f0309a; --green:#16a34a;
      --sans:'Roboto',system-ui,sans-serif; --display:'Roboto Slab','Roboto',system-ui,serif;
    }

    @keyframes pulseGlow { 0%,100%{opacity:.5;} 50%{opacity:1;} }
    @keyframes bubbleIn  { from{opacity:0;transform:translateY(12px) scale(.98);} to{opacity:1;transform:translateY(0) scale(1);} }
    @keyframes blink     { 0%,80%,100%{opacity:.25;transform:translateY(0);} 40%{opacity:1;transform:translateY(-3px);} }
    @keyframes barPulse  { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
    @keyframes spin      { to{transform:rotate(360deg);} }
    @keyframes loadFill  { from{width:4%;} to{width:100%;} }
    @keyframes dash      { to{background-position:22px 0;} }

    body { font-family:var(--sans); background:var(--bg); color:var(--text); min-height:100vh; min-height:100svh; overflow-x:hidden; font-weight:400; display:flex; align-items:center; justify-content:center; padding:20px; }
    html::before { content:''; position:fixed; inset:0; background-image:radial-gradient(at 20% 80%, #0b1535 1px, transparent 0); background-size:3px 3px; pointer-events:none; opacity:.05; z-index:1; }
    .bg-orb { position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0; }
    .orb-1 { width:700px; height:700px; top:-240px; right:-120px; background:radial-gradient(circle, rgba(233,30,140,.10), transparent 70%); animation:pulseGlow 8s ease-in-out infinite; }
    .orb-2 { width:500px; height:500px; bottom:6%; left:-160px; background:radial-gradient(circle, rgba(26,58,110,.06), transparent 70%); animation:pulseGlow 12s ease-in-out infinite reverse; }

    .chat { position:relative; z-index:2; width:100%; max-width:460px; height:min(760px, 92svh); display:flex; flex-direction:column; background:var(--bg-card); border:1px solid var(--line); border-radius:22px; overflow:hidden; box-shadow:0 24px 60px rgba(11,21,53,.16), 0 0 30px rgba(233,30,140,.08); }
    .chat-bar { height:4px; background:linear-gradient(90deg, var(--lime), var(--lime-soft), var(--lime)); background-size:200% 100%; animation:barPulse 4s ease-in-out infinite; }

    .chat-head { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); background:#fff; }
    .chat-logo-plate { height:44px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .chat-logo-plate img { height:28px; width:auto; display:block; }
    .chat-logo-fallback { font-family:var(--display); font-size:16px; font-weight:800; color:var(--lime); line-height:1; }
    .chat-id { display:flex; flex-direction:column; gap:4px; min-width:0; }
    .chat-name { font-family:var(--display); font-size:14px; font-weight:700; color:var(--text); line-height:1.1; }
    .chat-status { font-size:11px; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
    .chat-status b { color:#16a34a; font-weight:600; }
    .chat-tag { margin-left:auto; flex-shrink:0; font-size:9px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--lime); border:1px solid rgba(233,30,140,.3); background:rgba(233,30,140,.06); padding:5px 10px; border-radius:999px; }

    .chat-log { flex:1; overflow-y:auto; padding:22px 18px 8px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
    .chat-log::-webkit-scrollbar { width:6px; }
    .chat-log::-webkit-scrollbar-thumb { background:rgba(11,21,53,.14); border-radius:999px; }

    .msg { display:flex; max-width:84%; animation:bubbleIn .35s ease-out both; }
    .msg.bot { align-self:flex-start; }
    .msg.user { align-self:flex-end; justify-content:flex-end; }
    .bubble { padding:12px 16px; font-size:14.5px; line-height:1.55; border-radius:18px; }
    .bubble strong { font-weight:700; color:var(--text); }
    .msg.user .bubble strong { color:#fff; }
    .msg.bot .bubble { background:var(--bg-soft); border:1px solid var(--line); color:var(--text); border-bottom-left-radius:6px; }
    .msg.user .bubble { background:linear-gradient(92deg, var(--lime) 0%, var(--lime-soft) 100%); color:#fff; border-bottom-right-radius:6px; box-shadow:0 4px 14px rgba(233,30,140,.25); }

    .typing .bubble { display:flex; gap:5px; padding:15px 18px; }
    .typing .dot { width:7px; height:7px; border-radius:50%; background:var(--text-dim); animation:blink 1.3s infinite; }
    .typing .dot:nth-child(2){ animation-delay:.18s; } .typing .dot:nth-child(3){ animation-delay:.36s; }

    .chat-foot { border-top:1px solid var(--line); padding:14px 16px 16px; background:#f7f9fc; }

    .msg.options { align-self:stretch; max-width:100%; justify-content:flex-end; }
    .options-wrap { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; width:100%; }
    .chip { flex:0 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border:1.5px solid rgba(233,30,140,.5); background:rgba(233,30,140,.08); color:var(--text); border-radius:999px; font-family:var(--sans); font-size:13.5px; font-weight:600; cursor:pointer; transition:background .18s, border-color .18s, transform .12s, box-shadow .18s; white-space:nowrap; text-align:left; }
    .chip svg { width:15px; height:15px; stroke:var(--lime); fill:none; stroke-width:2.2; flex-shrink:0; }
    .chip:hover { background:rgba(233,30,140,.18); border-color:var(--lime); transform:translateY(-1px); box-shadow:0 4px 14px rgba(233,30,140,.22); }
    .chip:active { transform:scale(.97); }

    .input-bar { display:flex; align-items:center; gap:8px; }
    .input-bar.hidden { display:none; }
    .country-select { flex-shrink:0; width:84px; background:#fff; border:1px solid var(--line-strong); border-radius:12px; padding:13px 8px; color:var(--text); font-family:var(--sans); font-size:13px; text-align:center; outline:none; }
    .country-select.hidden { display:none; }
    .field { flex:1; background:#fff; border:1px solid var(--line-strong); border-radius:999px; padding:14px 18px; color:var(--text); font-family:var(--sans); font-size:14.5px; outline:none; transition:border-color .2s; }
    .field::placeholder { color:var(--text-faint); }
    .field:focus { border-color:rgba(233,30,140,.5); }
    .send-btn { flex-shrink:0; width:48px; height:48px; border:none; border-radius:50%; background:radial-gradient(38.67% 91.17% at 50% 8.83%, var(--orange) 0, var(--orange-2) 100%); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 0 16px rgba(233,30,140,.4); transition:filter .2s, transform .12s; }
    .send-btn svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2.2; }
    .send-btn:hover { filter:brightness(1.1); transform:scale(1.05); }

    .foot-secure { display:flex; align-items:center; justify-content:center; gap:7px; font-size:11px; color:var(--text-faint); margin-top:12px; }
    .foot-secure svg { width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2; }

    /* loading */
    .loading-card { border:1px solid rgba(233,30,140,.3); background:radial-gradient(circle at 15% 0%, rgba(233,30,140,.10), transparent 60%), rgba(233,30,140,.04); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:12px; margin-top:2px; }
    .loading-head { display:flex; align-items:center; gap:10px; }
    .loading-head .spin { width:18px; height:18px; flex-shrink:0; border:2.5px solid rgba(233,30,140,.22); border-top-color:var(--lime); border-radius:50%; animation:spin .8s linear infinite; }
    .loading-head b { font-family:var(--display); font-size:14px; font-weight:700; color:var(--text); }
    .loading-track { height:8px; border-radius:999px; background:rgba(11,21,53,.08); overflow:hidden; }
    .loading-fill { height:100%; border-radius:999px; background:linear-gradient(90deg, var(--lime), var(--lime-soft)); animation:loadFill 2.1s ease-out forwards; }
    .loading-step { font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:7px; }
    .loading-step svg { width:13px; height:13px; stroke:var(--lime); fill:none; stroke-width:2; flex-shrink:0; }

    /* card do concurso */
    .vagas-card { border:1px solid rgba(233,30,140,.3); background:radial-gradient(circle at 15% 0%, rgba(233,30,140,.10), transparent 60%), rgba(233,30,140,.04); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; margin-top:2px; }
    .vagas-head { display:flex; align-items:flex-start; gap:9px; }
    .vagas-head svg { width:17px; height:17px; stroke:var(--lime); fill:none; stroke-width:2; flex-shrink:0; margin-top:2px; }
    .vagas-head b { font-family:var(--display); font-size:14.5px; font-weight:700; color:var(--text); line-height:1.25; }
    .vagas-badges { display:flex; flex-wrap:wrap; gap:6px; }
    .badge { font-size:10.5px; font-weight:600; padding:4px 9px; border-radius:999px; border:1px solid var(--line-strong); color:var(--text-mute); background:var(--bg-soft); }
    .badge.open { color:var(--green); border-color:rgba(22,163,74,.35); background:rgba(22,163,74,.08); }
    .vagas-text { font-size:13.5px; line-height:1.55; color:var(--text-mute); }
    .vagas-text strong { color:var(--text); font-weight:600; }
    .vagas-salary { display:inline-flex; align-items:center; gap:7px; align-self:flex-start; font-size:13px; font-weight:700; color:var(--text); border:1px solid rgba(22,163,74,.35); background:rgba(22,163,74,.08); padding:7px 12px; border-radius:999px; }
    .vagas-salary svg { width:14px; height:14px; stroke:var(--green); fill:none; stroke-width:2; }
    .vagas-date { display:inline-flex; align-items:center; gap:7px; align-self:flex-start; font-size:13px; font-weight:700; color:var(--text); border:1px solid var(--line-strong); background:var(--bg-soft); padding:7px 12px; border-radius:999px; }
    .vagas-date svg { width:14px; height:14px; stroke:var(--lime); fill:none; stroke-width:2; }

    /* destaques (amplificação) */
    .opps-card { border:1px solid rgba(233,30,140,.3); background:radial-gradient(circle at 15% 0%, rgba(233,30,140,.08), transparent 60%), rgba(233,30,140,.03); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; margin-top:2px; }
    .opps-head { display:flex; align-items:center; gap:9px; }
    .opps-head svg { width:17px; height:17px; stroke:var(--lime); fill:none; stroke-width:2; flex-shrink:0; }
    .opps-head b { font-family:var(--display); font-size:14px; font-weight:700; color:var(--text); }
    .opp-item { display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line); background:#fff; border-radius:11px; }
    .opp-icon { width:30px; height:30px; flex-shrink:0; border-radius:9px; display:flex; align-items:center; justify-content:center; background:rgba(233,30,140,.08); border:1px solid rgba(233,30,140,.2); }
    .opp-icon svg { width:15px; height:15px; stroke:var(--lime); fill:none; stroke-width:2; }
    .opp-body { display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
    .opp-name { font-size:13px; font-weight:600; color:var(--text); line-height:1.25; }
    .opp-meta { font-size:11px; color:var(--text-dim); }

    /* summary */
    .summary { border:1px solid rgba(233,30,140,.3); background:rgba(233,30,140,.05); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; margin-top:2px; }
    .summary-row { display:flex; align-items:center; gap:11px; font-size:13.5px; color:var(--text-mute); }
    .summary-row svg { width:15px; height:15px; stroke:var(--lime); fill:none; stroke-width:2; flex-shrink:0; }
    .summary-row b { color:var(--text); font-weight:600; }

    /* cupom */
    .coupon { position:relative; border:1.5px dashed var(--lime); background:radial-gradient(circle at 12% 0%, rgba(233,30,140,.12), transparent 55%), rgba(233,30,140,.05); border-radius:16px; padding:18px 18px 16px; display:flex; flex-direction:column; gap:8px; margin-top:2px; overflow:hidden; }
    .coupon::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:repeating-linear-gradient(90deg, var(--lime) 0 11px, transparent 11px 22px); background-size:22px 5px; animation:dash 1.2s linear infinite; opacity:.8; }
    .coupon-tag { align-self:flex-start; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--lime); border:1px solid rgba(233,30,140,.4); background:rgba(233,30,140,.08); padding:4px 10px; border-radius:999px; }
    .coupon-title { font-family:var(--display); font-size:17px; font-weight:800; color:var(--text); line-height:1.2; }
    .coupon-sub { font-size:13px; line-height:1.5; color:var(--text-mute); }
    .coupon-sub strong { color:var(--text); font-weight:700; }
    .coupon-code { align-self:flex-start; display:inline-flex; align-items:center; gap:8px; font-family:var(--display); font-size:15px; font-weight:800; letter-spacing:.06em; color:var(--text); border:1.5px solid rgba(233,30,140,.4); background:#fff; padding:8px 14px; border-radius:10px; margin-top:2px; }
    .coupon-code svg { width:15px; height:15px; stroke:var(--lime); fill:none; stroke-width:2; }

    .cta-link { display:inline-flex; align-items:center; justify-content:center; gap:9px; margin-top:4px; padding:15px 20px; border-radius:14px; background:linear-gradient(92deg, #25D366 0%, #1ebe5b 100%); color:#fff; font-family:var(--sans); font-size:14.5px; font-weight:800; text-decoration:none; box-shadow:0 8px 22px rgba(37,211,102,.35); transition:filter .2s, transform .12s; }
    .cta-link svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2.2; }
    .cta-link:hover { filter:brightness(1.05); transform:translateY(-1px); }

    @media (max-width:520px) { body{padding:0;} .chat{max-width:100%; height:100svh; border-radius:0; border:none;} }
  </style>
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="chat" role="dialog" aria-label="Atendimento OdonConcursos">
    <div class="chat-bar"></div>

    <header class="chat-head">
      <div class="chat-logo-plate">
        <img src="https://odonconcursos.com.br/assets/img/logo.png" alt="OdonConcursos"
             onerror="this.outerHTML='<span class=&quot;chat-logo-fallback&quot;>ODON</span>'">
      </div>
      <div class="chat-id">
        <div class="chat-name">Equipe OdonConcursos</div>
        <div class="chat-status"><b>● online</b> · responde na hora</div>
      </div>
      <span class="chat-tag">Ipatinga Saúde · MG</span>
    </header>

    <div class="chat-log" id="log" aria-live="polite"></div>

    <footer class="chat-foot">
      <form class="input-bar hidden" id="inputBar" autocomplete="off">
        <select class="country-select hidden" id="country">
          <option value="55" selected>🇧🇷 +55</option>
          <option value="351">🇵🇹 +351</option>
          <option value="1">🇺🇸 +1</option>
          <option value="44">🇬🇧 +44</option>
          <option value="54">🇦🇷 +54</option>
        </select>
        <input class="field" id="field" type="text" placeholder="Digite aqui…" aria-label="Sua resposta" />
        <button class="send-btn" id="send" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
      <div class="foot-secure"><i data-lucide="lock"></i><span>Seus dados estão seguros</span></div>
    </footer>
  </div>

  <script>
    lucide.createIcons();

    /* ════════════════════════════════════════════════════════════════
       CONFIGURAÇÃO — edite aqui
       ════════════════════════════════════════════════════════════════ */

    // ►► COLE AQUI a URL do seu webhook (Make / n8n / Zapier / CRM…)
    const WEBHOOK_URL = '';

    // Pixel do Meta Ads — dispara PageView no <head>
    const META_PIXEL_ID = '3213093405602824';

    // Número do WhatsApp (55 + DDD + número, só dígitos)
    const WHATSAPP_NUMERO = '5519994565534';

    // Identificador do formulário (vai pro webhook)
    const FORMULARIO = 'Ipatinga Saúde · Cupom';

    // Dados do concurso (Ipatinga Saúde · Odontologia)
    const CONCURSO = {
      nome:    'Ipatinga Saúde · Odontologia',
      banca:   'IMAM',
      cupom:   'ODON-IPATINGA',
      salario: 'até R$ 5.636,18',
      prova:   '15, 16, 22 e 23/08/2026',
      texto:   '<strong>18 vagas para Odontólogo</strong> em várias frentes — Concurso Público de Provas e Títulos (Edital 001/2026). Inscrições de <strong>17/06 a 17/07/2026</strong>.'
    };

    /* ════════════════════════════════════════════════════════════════ */

    const log      = document.getElementById('log');
    const inputBar = document.getElementById('inputBar');
    const field    = document.getElementById('field');
    const country  = document.getElementById('country');

    const data = {
      nome:'', telefone:'', email:'',
      concurso: CONCURSO.nome, cupom: CONCURSO.cupom,
      q_remuneracao:'', q_preparo:'', q_direcionada:'', q_interesse:''
    };

    const tracking = (() => {
      const p = new URLSearchParams(window.location.search);
      const g = (k) => p.get(k) || '';
      return {
        utm_source:g('utm_source'), utm_medium:g('utm_medium'), utm_campaign:g('utm_campaign'),
        utm_content:g('utm_content'), utm_term:g('utm_term'),
        fbclid:g('fbclid'), gclid:g('gclid'),
        referrer:document.referrer||'', landing_url:window.location.href
      };
    })();

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const scrollDown = () => { log.scrollTop = log.scrollHeight; };

    function addUser(text) {
      const m = document.createElement('div'); m.className = 'msg user';
      m.innerHTML = `<div class="bubble"></div>`;
      m.querySelector('.bubble').textContent = text;
      log.appendChild(m); scrollDown();
    }
    function addBotHTML(html) {
      const m = document.createElement('div'); m.className = 'msg bot';
      m.innerHTML = `<div class="bubble">${html}</div>`;
      log.appendChild(m); lucide.createIcons(); scrollDown();
    }
    async function botSay(html, delay = 750) {
      const t = document.createElement('div'); t.className = 'msg bot typing';
      t.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
      log.appendChild(t); scrollDown();
      await sleep(delay); t.remove(); addBotHTML(html);
    }
    function hideInputs() { inputBar.classList.add('hidden'); }

    function showChips(options, { wide = false } = {}) {
      hideInputs();
      const m = document.createElement('div'); m.className = 'msg options';
      const wrap = document.createElement('div'); wrap.className = 'options-wrap';
      options.forEach(opt => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip' + (wide ? ' chip-wide' : '');
        b.innerHTML = `<i data-lucide="${opt.icon || 'circle'}"></i><span>${opt.label}</span>`;
        b.addEventListener('click', () => { m.remove(); opt.onPick(opt.value, opt.label); });
        wrap.appendChild(b);
      });
      m.appendChild(wrap); log.appendChild(m); lucide.createIcons(); scrollDown();
    }
    function askChips(options) {
      return new Promise(resolve => {
        showChips(options.map(o => ({
          label:o.label, value:o.value, icon:o.icon,
          onPick:(value,label)=>resolve({ value, label })
        })));
      });
    }

    let activeHandler = null;
    function showInput({ type = 'text', placeholder = 'Digite aqui…', phone = false, onSubmit }) {
      hideInputs(); inputBar.classList.remove('hidden');
      field.type = type; field.placeholder = placeholder; field.value = '';
      field.inputMode = (type === 'tel') ? 'numeric' : (type === 'email' ? 'email' : 'text');
      field.dataset.mask = phone ? 'tel' : '';
      country.classList.toggle('hidden', !phone);
      activeHandler = onSubmit;
      setTimeout(() => field.focus(), 60); scrollDown();
    }
    inputBar.addEventListener('submit', (e) => { e.preventDefault(); if (activeHandler) activeHandler(field.value.trim()); });

    // máscara de telefone (Brasil): (XX) XXXXX-XXXX
    function maskTelBR(v) {
      const d = v.replace(/\D/g, '').slice(0, 11); const len = d.length;
      if (len === 0)  return '';
      if (len <= 2)   return '(' + d;
      if (len <= 6)   return '(' + d.slice(0,2) + ') ' + d.slice(2);
      if (len <= 10)  return '(' + d.slice(0,2) + ') ' + d.slice(2,6) + '-' + d.slice(6);
      return '(' + d.slice(0,2) + ') ' + d.slice(2,7) + '-' + d.slice(7);
    }
    field.addEventListener('input', () => {
      if (field.dataset.mask === 'tel' && country.value === '55') field.value = maskTelBR(field.value);
    });
    country.addEventListener('change', () => {
      if (field.dataset.mask !== 'tel') return;
      field.value = (country.value === '55') ? maskTelBR(field.value) : field.value.replace(/[()\-\s]/g, '');
    });

    const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    const phoneDigits = (v) => v.replace(/\D/g, '');

    /* ─── fluxo ─── */
    async function start() {
      await botSay('Olá! Aqui é a equipe do <strong>OdonConcursos</strong>. 👋', 650);
      await botSay('O concurso da <strong>Ipatinga Saúde (MG)</strong> está com <strong>inscrições abertas</strong> — e é uma das <strong>melhores oportunidades para dentista</strong> em Minas Gerais agora.', 1300);
      await askNome();
    }

    async function askNome() {
      await botSay('Antes de te mostrar os detalhes, como posso te chamar?', 900);
      showInput({
        type:'text', placeholder:'Seu nome',
        onSubmit: async (v) => {
          const nome = v.trim();
          if (nome.replace(/\s/g, '').length < 2) { await botSay('Pode me dizer o seu nome? 🙂', 600); return; }
          data.nome = nome; addUser(nome); hideInputs();
          await botSay(`Prazer, <strong>${escapeHtml(nome.split(' ')[0])}</strong>! 😃`, 700);
          await loadConcurso();
        }
      });
    }

    async function loadConcurso() {
      await botSay('Deixa eu puxar os <strong>detalhes do concurso</strong> pra você.', 850);
      const card = document.createElement('div'); card.className = 'msg bot';
      card.innerHTML = `
        <div class="loading-card">
          <div class="loading-head"><span class="spin"></span><b>Consultando Ipatinga Saúde</b></div>
          <div class="loading-track"><div class="loading-fill"></div></div>
          <div class="loading-step" id="ls"><i data-lucide="search"></i><span>Verificando edital e vagas</span></div>
        </div>`;
      log.appendChild(card); lucide.createIcons(); scrollDown();
      const step = card.querySelector('#ls span');
      await sleep(800); step.textContent = 'Filtrando vagas para Cirurgião-Dentista';
      await sleep(800); step.textContent = 'Verificando remuneração e datas';
      await sleep(800);
      await revealConcurso();
    }

    async function revealConcurso() {
      await botSay('Encontrei. Veja o resumo:', 800);
      const m = document.createElement('div'); m.className = 'msg bot';
      m.innerHTML = `
        <div class="vagas-card">
          <div class="vagas-head"><i data-lucide="briefcase"></i><b>${escapeHtml(CONCURSO.nome)}</b></div>
          <div class="vagas-badges">
            <span class="badge open">Inscrições abertas</span>
            <span class="badge">Banca ${escapeHtml(CONCURSO.banca)}</span>
          </div>
          <div class="vagas-text">${CONCURSO.texto}</div>
          <span class="vagas-salary"><i data-lucide="trending-up"></i>${escapeHtml(CONCURSO.salario)}</span>
          <span class="vagas-date"><i data-lucide="calendar"></i>Provas: ${escapeHtml(CONCURSO.prova)}</span>
        </div>`;
      log.appendChild(m); lucide.createIcons(); scrollDown();
      await sleep(500);
      await qualificar();
    }

    /* ─── qualificação (mesmo funil do chat do Sudeste) ─── */
    async function qualificar() {
      // DESEJO
      await botSay('O edital está <strong>com as inscrições abertas</strong> — dá pra entrar agora.', 1000);
      await botSay(`E olha a remuneração: <strong>${escapeHtml(CONCURSO.salario)}</strong>. É um dos melhores salários pra dentista na região.`, 1150);
      await botSay('Uma vaga dessas mudaria a sua rotina, né?', 900);
      let a = await askChips([
        { label:'Mudaria muito', value:'mudaria_muito', icon:'trending-up' },
        { label:'Com certeza',   value:'com_certeza',   icon:'thumbs-up' },
      ]);
      addUser(a.label); data.q_remuneracao = a.label;

      // AMPLIFICAÇÃO (destaques do concurso)
      await mostrarDestaques();

      // PROBLEMA / GAP
      await botSay('Agora vou ser direto com você: <strong>a concorrência por essas vagas só cresce</strong>. Quem é aprovado não é quem estuda mais — é quem estuda <strong>direcionado pra banca certa</strong>.', 1300);

      await botSay('Me conta: você <strong>já está se preparando</strong> para esse concurso?', 950);
      a = await askChips([
        { label:'Já estou estudando', value:'sim', icon:'book-open' },
        { label:'Ainda não comecei',  value:'nao', icon:'clock' },
      ]);
      addUser(a.label); data.q_preparo = a.label;
      const jaEstuda = (a.value === 'sim');

      await botSay(
        jaEstuda
          ? 'E o seu estudo já está <strong>focado pra banca IMAM</strong> desse concurso?'
          : 'Tranquilo — e é justamente aí que a maioria escorrega. O caminho é estudar <strong>focado pra banca IMAM</strong>, em vez de estudar tudo solto.',
        1100
      );
      a = await askChips([
        { label:'Já está direcionado', value:'sim', icon:'check' },
        { label:'Ainda não',           value:'nao', icon:'x' },
      ]);
      addUser(a.label); data.q_direcionada = a.label;

      // SOLUÇÃO + cupom
      await botSay('A nossa equipe pode te ajudar a focar no que <strong>realmente cai pra banca IMAM</strong> — e ainda liberar um <strong>cupom exclusivo</strong> pra você.', 1250);
      await botSay('Quer aproveitar?', 850);
      a = await askChips([
        { label:'Quero sim',   value:'sim',  icon:'sparkles' },
        { label:'Pode chamar', value:'sim2', icon:'arrow-right' },
      ]);
      addUser(a.label); data.q_interesse = a.label;

      // PONTE
      await botSay(`Combinado, <strong>${escapeHtml(data.nome.split(' ')[0])}</strong>! Vou garantir o seu <strong>cupom exclusivo do ${escapeHtml(CONCURSO.nome)}</strong> e o contato com a nossa equipe. Me passa só mais dois dados 👇`, 1250);
      await askTelefone();
    }

    async function mostrarDestaques() {
      await botSay('E não é só a vaga: <strong>veja por que esse concurso vale tanto a pena</strong>:', 1150);
      const m = document.createElement('div'); m.className = 'msg bot';
      m.innerHTML = `
        <div class="opps-card">
          <div class="opps-head"><i data-lucide="sparkles"></i><b>Destaques do concurso</b></div>
          <div class="opp-item">
            <div class="opp-icon"><i data-lucide="users"></i></div>
            <div class="opp-body"><div class="opp-name">18 vagas só para Odontólogo</div><div class="opp-meta">uma das maiores ofertas pra dentista em MG</div></div>
          </div>
          <div class="opp-item">
            <div class="opp-icon"><i data-lucide="award"></i></div>
            <div class="opp-body"><div class="opp-name">Concurso de Provas e Títulos</div><div class="opp-meta">sua experiência e cursos contam pontos</div></div>
          </div>
          <div class="opp-item">
            <div class="opp-icon"><i data-lucide="clock"></i></div>
            <div class="opp-body"><div class="opp-name">Inscrições só até 17/07</div><div class="opp-meta">e a prova já é em agosto — pouco tempo pra se preparar</div></div>
          </div>
        </div>`;
      log.appendChild(m); lucide.createIcons(); scrollDown();
      await sleep(600);
      await botSay('Ou seja: <strong>quem se mexer agora sai na frente.</strong>', 950);
    }

    async function askTelefone() {
      await botSay('Qual o seu <strong>WhatsApp</strong>? É por lá que a nossa equipe fala com você e libera o cupom.', 900);
      showInput({
        type:'tel', phone:true, placeholder:'(11) 90000-0000',
        onSubmit: async (v) => {
          const digits = phoneDigits(v);
          if (digits.length < 8) { await botSay('O número parece incompleto. Confira o DDD e o número, por favor.', 650); return; }
          data.telefone = '+' + country.value + digits;
          addUser('+' + country.value + ' ' + v); hideInputs();
          await askEmail();
        }
      });
    }

    async function askEmail() {
      await botSay('E o seu melhor <strong>e-mail</strong>, pra registrar o seu contato.', 900);
      showInput({
        type:'email', placeholder:'seu@email.com',
        onSubmit: async (v) => {
          if (!isEmail(v)) { await botSay('O e-mail informado não parece válido. Por favor, confira.', 650); return; }
          data.email = v; addUser(v); hideInputs();
          await finish();
        }
      });
    }

    async function finish() {
      fireMetaLead(); sendWebhook();

      await botSay('Recebemos as suas informações. Confira abaixo se estão corretas:', 950);
      const m = document.createElement('div'); m.className = 'msg bot';
      m.innerHTML = `
        <div class="summary">
          <div class="summary-row"><i data-lucide="user"></i><span><b>${escapeHtml(data.nome)}</b></span></div>
          <div class="summary-row"><i data-lucide="briefcase"></i><span>${escapeHtml(CONCURSO.nome)}</span></div>
          <div class="summary-row"><i data-lucide="phone"></i><span>${escapeHtml(data.telefone)}</span></div>
          <div class="summary-row"><i data-lucide="mail"></i><span>${escapeHtml(data.email)}</span></div>
        </div>`;
      log.appendChild(m); lucide.createIcons(); scrollDown();

      await botSay(`Tudo certo, <strong>${escapeHtml(data.nome.split(' ')[0])}</strong>! Liberamos o seu <strong>cupom exclusivo do ${escapeHtml(CONCURSO.nome)}</strong>. 🎟️`, 1100);

      const msg = `Olá! Recebi um anúncio sobre o concurso da ${CONCURSO.nome} e tenho interesse em mais informações. Poderia me ajudar?`;
      const waLink = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(msg)}`;

      const cup = document.createElement('div'); cup.className = 'msg bot';
      cup.innerHTML = `
        <div class="coupon">
          <span class="coupon-tag">Cupom exclusivo</span>
          <div class="coupon-title">${escapeHtml(CONCURSO.nome)}</div>
          <div class="coupon-sub">Clique abaixo pra <strong>resgatar o cupom</strong> e falar com a nossa equipe no WhatsApp. <strong>Válido por tempo limitado.</strong></div>
          <span class="coupon-code"><i data-lucide="ticket"></i>${escapeHtml(CONCURSO.cupom)}</span>
          <a class="cta-link" href="${waLink}" target="_blank" rel="noopener">
            <i data-lucide="message-circle"></i>Resgatar cupom no WhatsApp
          </a>
        </div>`;
      log.appendChild(cup); lucide.createIcons(); scrollDown();
    }

    /* ─── Meta Ads ─── */
    function fireMetaLead() {
      try {
        if (typeof fbq === 'function') {
          fbq('track', 'Lead', { content_name: 'Concurso - ' + CONCURSO.nome, content_category: 'Ipatinga Saúde' });
        }
      } catch (err) { console.error('Meta Pixel error:', err); }
    }

    /* ─── Webhook ─── */
    async function sendWebhook() {
      const now = new Date();
      const payload = {
        formulario: FORMULARIO,
        nome: data.nome, email: data.email, telefone: data.telefone,
        concurso: data.concurso, cupom: data.cupom,
        q_remuneracao: data.q_remuneracao, q_preparo: data.q_preparo,
        q_direcionada: data.q_direcionada, q_interesse: data.q_interesse,
        origem: 'Chat captura OdonConcursos - Ipatinga (cupom)',
        data_contato: now.toISOString(),
        data_contato_br: now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR'),
        ...tracking
      };
      try {
        if (WEBHOOK_URL) {
          await fetch(WEBHOOK_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        } else {
          console.log('Lead (configure WEBHOOK_URL):', payload);
        }
      } catch (err) { console.error('Webhook error:', err); }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    start();
  </script>
</body>
</html>
