<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concursos de Odontologia no Sul · OdonConcursos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800;900&family=Roboto+Slab:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Meta Pixel Code -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    :root {
      --bg:           #eef1f7;
      --bg-soft:      #f1f3f9;
      --bg-card:      #ffffff;
      --line:         rgba(11,21,53,0.10);
      --line-strong:  rgba(11,21,53,0.18);
      --text:         #0b1535;
      --text-mute:    #475569;
      --text-dim:     #64748b;
      --text-faint:   #94a3b8;

      --lime:         #e91e8c;
      --lime-soft:    #f472b6;
      --green:        #1a3a6e;
      --orange:       #e91e8c;
      --orange-2:     #f0309a;

      --sans:    'Roboto', system-ui, sans-serif;
      --display: 'Roboto Slab', 'Roboto', system-ui, serif;
    }

    @keyframes pulseGlow { 0%,100% { opacity:.5; } 50% { opacity:1; } }
    @keyframes bubbleIn  { from { opacity:0; transform: translateY(12px) scale(.98); } to { opacity:1; transform: translateY(0) scale(1); } }
    @keyframes blink     { 0%,80%,100% { opacity:.25; transform: translateY(0); } 40% { opacity:1; transform: translateY(-3px); } }
    @keyframes barPulse  { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes spin      { to { transform: rotate(360deg); } }
    @keyframes loadFill  { from { width: 4%; } to { width: 100%; } }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    html::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(at 20% 80%, #0b1535 1px, transparent 0);
      background-size: 3px 3px;
      pointer-events: none;
      opacity: .05;
      z-index: 1;
    }
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
    .orb-1 {
      width: 700px; height: 700px; top: -240px; right: -120px;
      background: radial-gradient(circle, rgba(233,30,140,.10), transparent 70%);
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .orb-2 {
      width: 500px; height: 500px; bottom: 6%; left: -160px;
      background: radial-gradient(circle, rgba(26,58,110,.06), transparent 70%);
      animation: pulseGlow 12s ease-in-out infinite reverse;
    }

    /* ─── CHAT SHELL ─── */
    .chat {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 460px;
      height: min(760px, 92svh);
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(11,21,53,.16), 0 0 30px rgba(233,30,140,.08);
    }
    .chat-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--lime), var(--lime-soft), var(--lime));
      background-size: 200% 100%;
      animation: barPulse 4s ease-in-out infinite;
    }

    /* header */
    .chat-head {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    .chat-logo-plate {
      height: 44px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chat-logo-plate img { height: 28px; width: auto; display: block; }
    .chat-logo-fallback { font-family: var(--display); font-size: 16px; font-weight: 800; color: var(--lime); line-height: 1; letter-spacing: -.01em; }
    .chat-id { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .chat-name { font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.1; }
    .chat-status { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
    .chat-status b { color: #16a34a; font-weight: 600; }
    .chat-tag {
      margin-left: auto; flex-shrink: 0;
      font-size: 9px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
      color: var(--lime); opacity: .9;
      border: 1px solid rgba(233,30,140,.3);
      background: rgba(233,30,140,.06);
      padding: 5px 10px; border-radius: 999px;
    }

    /* messages */
    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .chat-log::-webkit-scrollbar { width: 6px; }
    .chat-log::-webkit-scrollbar-thumb { background: rgba(11,21,53,.14); border-radius: 999px; }

    .msg { display: flex; max-width: 84%; animation: bubbleIn .35s ease-out both; }
    .msg.bot  { align-self: flex-start; }
    .msg.user { align-self: flex-end; justify-content: flex-end; }
    .bubble {
      padding: 12px 16px;
      font-size: 14.5px;
      line-height: 1.55;
      border-radius: 18px;
    }
    .bubble strong { font-weight: 700; color: var(--text); }
    .msg.user .bubble strong { color: #fff; }
    .msg.bot .bubble {
      background: var(--bg-soft);
      border: 1px solid var(--line);
      color: var(--text);
      border-bottom-left-radius: 6px;
    }
    .msg.user .bubble {
      background: linear-gradient(92deg, var(--lime) 0%, var(--lime-soft) 100%);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(233,30,140,.25);
    }

    /* typing indicator */
    .typing .bubble { display: flex; gap: 5px; padding: 15px 18px; }
    .typing .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); animation: blink 1.3s infinite; }
    .typing .dot:nth-child(2) { animation-delay: .18s; }
    .typing .dot:nth-child(3) { animation-delay: .36s; }

    /* footer / input zone */
    .chat-foot {
      border-top: 1px solid var(--line);
      padding: 14px 16px 16px;
      background: #f7f9fc;
    }

    /* quick reply chips — inside the chat, aligned to the user's side */
    .msg.options { align-self: stretch; max-width: 100%; justify-content: flex-end; }
    .options-wrap {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: flex-end;
      width: 100%;
    }
    .chip {
      flex: 0 1 auto;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 18px;
      border: 1.5px solid rgba(233,30,140,.5);
      background: rgba(233,30,140,.08);
      color: var(--text);
      border-radius: 999px;
      font-family: var(--sans);
      font-size: 13.5px; font-weight: 600;
      cursor: pointer;
      transition: background .18s, border-color .18s, transform .12s, box-shadow .18s;
      white-space: nowrap;
    }
    .chip svg { width: 15px; height: 15px; stroke: var(--lime); fill: none; stroke-width: 2.2; }
    .chip:hover {
      background: rgba(233,30,140,.18);
      border-color: var(--lime);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(233,30,140,.22);
    }
    .chip:active { transform: scale(.97); }

    /* text input bar */
    .input-bar { display: flex; align-items: center; gap: 8px; }
    .input-bar.hidden { display: none; }
    .country-select {
      flex-shrink: 0;
      width: 84px;
      background: #ffffff;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 13px 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      text-align: center;
      outline: none;
      transition: border-color .2s;
    }
    .country-select.hidden { display: none; }
    .field {
      flex: 1;
      background: #ffffff;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 14px 18px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14.5px;
      outline: none;
      transition: border-color .2s;
    }
    .field::placeholder { color: var(--text-faint); }
    .field:focus { border-color: rgba(233,30,140,.5); }
    .send-btn {
      flex-shrink: 0;
      width: 48px; height: 48px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(38.67% 91.17% at 50% 8.83%, var(--orange) 0, var(--orange-2) 100%);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(233,30,140,.4);
      transition: filter .2s, transform .12s;
    }
    .send-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .send-btn:hover { filter: brightness(1.1); transform: scale(1.05); }
    .send-btn:active { transform: scale(.96); }

    .foot-secure {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      font-size: 11px; color: var(--text-faint);
      margin-top: 12px;
    }
    .foot-secure svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* loading vagas card */
    .loading-card {
      border: 1px solid rgba(233,30,140,.3);
      background:
        radial-gradient(circle at 15% 0%, rgba(233,30,140,.10), transparent 60%),
        rgba(233,30,140,.04);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex; flex-direction: column; gap: 12px;
      margin-top: 2px;
    }
    .loading-head { display: flex; align-items: center; gap: 10px; }
    .loading-head .spin {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 2.5px solid rgba(233,30,140,.22);
      border-top-color: var(--lime);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loading-head b { font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--text); }
    .loading-track { height: 8px; border-radius: 999px; background: rgba(11,21,53,.08); overflow: hidden; }
    .loading-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--lime), var(--lime-soft));
      animation: loadFill 2.1s ease-out forwards;
    }
    .loading-step { font-size: 12.5px; color: var(--text-dim); display: flex; align-items: center; gap: 7px; }
    .loading-step svg { width: 13px; height: 13px; stroke: var(--lime); fill: none; stroke-width: 2; flex-shrink: 0; }

    /* vagas highlight card */
    .vagas-card {
      border: 1px solid rgba(233,30,140,.3);
      background:
        radial-gradient(circle at 15% 0%, rgba(233,30,140,.10), transparent 60%),
        rgba(233,30,140,.04);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex; flex-direction: column; gap: 10px;
      margin-top: 2px;
    }
    .vagas-head { display: flex; align-items: center; gap: 9px; }
    .vagas-head svg { width: 17px; height: 17px; stroke: var(--lime); fill: none; stroke-width: 2; flex-shrink: 0; }
    .vagas-head b { font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--text); }
    .vagas-count { font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--lime); line-height: 1; }
    .vagas-text { font-size: 13.5px; line-height: 1.55; color: var(--text-mute); }
    .vagas-text strong { color: var(--text); font-weight: 600; }
    .vagas-salary {
      display: inline-flex; align-items: center; gap: 7px;
      align-self: flex-start;
      font-size: 13px; font-weight: 700; color: var(--text);
      border: 1px solid rgba(22,163,74,.35);
      background: rgba(22,163,74,.08);
      padding: 7px 12px; border-radius: 999px;
    }
    .vagas-salary svg { width: 14px; height: 14px; stroke: #16a34a; fill: none; stroke-width: 2; }

    /* summary card (final) */
    .summary {
      border: 1px solid rgba(233,30,140,.3);
      background: rgba(233,30,140,.05);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex; flex-direction: column; gap: 10px;
      margin-top: 2px;
    }
    .summary-row { display: flex; align-items: center; gap: 11px; font-size: 13.5px; color: var(--text-mute); }
    .summary-row svg { width: 15px; height: 15px; stroke: var(--lime); fill: none; stroke-width: 2; flex-shrink: 0; }
    .summary-row b { color: var(--text); font-weight: 600; }

    /* CTA link button */
    .cta-link {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      margin-top: 2px;
      padding: 14px 20px;
      border-radius: 14px;
      background: radial-gradient(38.67% 91.17% at 50% 8.83%, var(--orange) 0, var(--orange-2) 100%);
      color: #fff;
      font-family: var(--sans);
      font-size: 14px; font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(233,30,140,.30);
      transition: filter .2s, transform .12s;
    }
    .cta-link svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .cta-link:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .cta-link:active { transform: scale(.98); }

    @media (max-width: 520px) {
      body { padding: 0; }
      .chat { max-width: 100%; height: 100svh; border-radius: 0; border: none; }
    }
  </style>
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="chat" role="dialog" aria-label="Atendimento OdonConcursos">
    <div class="chat-bar"></div>

    <header class="chat-head">
      <div class="chat-logo-plate">
        <img src="https://odonconcursos.com.br/assets/img/logo.png" alt="OdonConcursos"
             onerror="this.outerHTML='<span class=&quot;chat-logo-fallback&quot;>ODON</span>'">
      </div>
      <div class="chat-id">
        <div class="chat-name">Equipe OdonConcursos</div>
        <div class="chat-status"><b>● online</b> · responde na hora</div>
      </div>
      <span class="chat-tag">Região Sul</span>
    </header>

    <div class="chat-log" id="log" aria-live="polite"></div>

    <footer class="chat-foot">
      <form class="input-bar hidden" id="inputBar" autocomplete="off">
        <select class="country-select hidden" id="country">
          <option value="55" selected>🇧🇷 +55</option>
          <option value="351">🇵🇹 +351</option>
          <option value="1">🇺🇸 +1</option>
          <option value="44">🇬🇧 +44</option>
          <option value="54">🇦🇷 +54</option>
        </select>
        <input class="field" id="field" type="text" placeholder="Digite aqui…" aria-label="Sua resposta" />
        <button class="send-btn" id="send" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>

      <div class="foot-secure">
        <i data-lucide="lock"></i>
        <span>Seus dados estão seguros</span>
      </div>
    </footer>
  </div>

  <script>
    lucide.createIcons();

    /* ════════════════════════════════════════════════════════════════
       CONFIGURAÇÃO  —  edite aqui
       ════════════════════════════════════════════════════════════════ */

    // 1) Webhook que vai receber os dados (Make / n8n / Zapier / CRM…)
    //    Cole a URL do seu webhook entre as aspas abaixo.
    const WEBHOOK_URL = 'https://hook.us2.make.com/c2wkeh4emj5df7gxoes21g0tkopvjam1';

    // 2) Pixel do Meta Ads (já configurado no <head>)
    const META_PIXEL_ID = '3213093405602824';

    // 3) Link com todos os concursos
    const CONCURSOS_URL = 'https://odonconcursospage.com/rs/';

    // 4) Identificador deste formulário (enviado ao webhook).
    //    Em cada página/landing, altere este valor para diferenciar a origem.
    const FORMULARIO = 'Região Sul';

    // Estados da Região Sul
    const ESTADOS = {
      'Rio Grande do Sul': { sigla: 'RS' },
      'Santa Catarina':    { sigla: 'SC' },
      'Paraná':            { sigla: 'PR' }
    };

    /* ════════════════════════════════════════════════════════════════ */

    const log      = document.getElementById('log');
    const inputBar = document.getElementById('inputBar');
    const field    = document.getElementById('field');
    const country  = document.getElementById('country');

    const data = { estado: '', sigla: '', nome: '', telefone: '', email: '' };

    // Captura UTMs e IDs de clique da URL no carregamento da página
    const tracking = (() => {
      const p = new URLSearchParams(window.location.search);
      const get = (k) => p.get(k) || '';
      return {
        utm_source:   get('utm_source'),
        utm_medium:   get('utm_medium'),
        utm_campaign: get('utm_campaign'),
        utm_content:  get('utm_content'),
        utm_term:     get('utm_term'),
        fbclid:       get('fbclid'),
        gclid:        get('gclid'),
        referrer:     document.referrer || '',
        landing_url:  window.location.href
      };
    })();

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const scrollDown = () => { log.scrollTop = log.scrollHeight; };

    function addUser(text) {
      const m = document.createElement('div');
      m.className = 'msg user';
      m.innerHTML = `<div class="bubble"></div>`;
      m.querySelector('.bubble').textContent = text;
      log.appendChild(m);
      scrollDown();
    }

    function addBotHTML(html) {
      const m = document.createElement('div');
      m.className = 'msg bot';
      m.innerHTML = `<div class="bubble">${html}</div>`;
      log.appendChild(m);
      lucide.createIcons();
      scrollDown();
    }

    async function botSay(html, delay = 750) {
      const t = document.createElement('div');
      t.className = 'msg bot typing';
      t.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
      log.appendChild(t);
      scrollDown();
      await sleep(delay);
      t.remove();
      addBotHTML(html);
    }

    function hideInputs() {
      inputBar.classList.add('hidden');
    }

    function showChips(options) {
      hideInputs();
      const m = document.createElement('div');
      m.className = 'msg options';
      const wrap = document.createElement('div');
      wrap.className = 'options-wrap';
      options.forEach(opt => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.innerHTML = `<i data-lucide="${opt.icon}"></i>${opt.label}`;
        b.addEventListener('click', () => {
          m.remove();
          opt.onPick(opt.value, opt.label);
        });
        wrap.appendChild(b);
      });
      m.appendChild(wrap);
      log.appendChild(m);
      lucide.createIcons();
      scrollDown();
    }

    let activeHandler = null;
    function showInput({ type = 'text', placeholder = 'Digite aqui…', phone = false, onSubmit }) {
      hideInputs();
      inputBar.classList.remove('hidden');
      field.type = type;
      field.placeholder = placeholder;
      field.value = '';
      field.inputMode = (type === 'tel') ? 'numeric' : (type === 'email' ? 'email' : 'text');
      country.classList.toggle('hidden', !phone);
      activeHandler = onSubmit;
      setTimeout(() => field.focus(), 60);
      scrollDown();
    }

    inputBar.addEventListener('submit', (e) => {
      e.preventDefault();
      if (activeHandler) activeHandler(field.value.trim());
    });

    /* ─── validators ─── */
    const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    const phoneDigits = (v) => v.replace(/\D/g, '');

    /* ─── conversation flow ─── */
    async function start() {
      await botSay('Olá. Aqui é a equipe do <strong>OdonConcursos</strong>.', 650);
      await botSay('Identificamos que você é da <strong>Região Sul</strong>, atualmente uma das regiões com maior número de <strong>concursos de Odontologia</strong>. Vamos verificar as oportunidades disponíveis para o seu estado.', 1300);
      await askEstado();
    }

    async function askEstado() {
      await botSay('Para começar, em qual <strong>estado da Região Sul</strong> você atua?', 850);
      showChips([
        { label: 'Rio Grande do Sul', value: 'Rio Grande do Sul', icon: 'map-pin', onPick: pickEstado },
        { label: 'Santa Catarina',    value: 'Santa Catarina',    icon: 'map-pin', onPick: pickEstado },
        { label: 'Paraná',            value: 'Paraná',            icon: 'map-pin', onPick: pickEstado },
      ]);
    }

    async function pickEstado(value, label) {
      data.estado = value;
      data.sigla = (ESTADOS[value] && ESTADOS[value].sigla) || '';
      addUser(label);
      hideInputs();

      await botSay(`Certo. Vou consultar as <strong>oportunidades disponíveis no ${escapeHtml(value)}</strong>.`, 900);
      await loadVagas(value);
    }

    async function loadVagas(value) {
      // card animado de "carregando vagas"
      const card = document.createElement('div');
      card.className = 'msg bot';
      card.innerHTML = `
        <div class="loading-card">
          <div class="loading-head"><span class="spin"></span><b>Consultando oportunidades no ${escapeHtml(value)}</b></div>
          <div class="loading-track"><div class="loading-fill"></div></div>
          <div class="loading-step" id="loadStep"><i data-lucide="search"></i><span>Consultando editais abertos</span></div>
        </div>`;
      log.appendChild(card);
      lucide.createIcons();
      scrollDown();

      const stepEl = card.querySelector('#loadStep span');
      await sleep(800);
      stepEl.textContent = 'Filtrando vagas para Cirurgião-Dentista';
      await sleep(800);
      stepEl.textContent = 'Verificando remuneração e benefícios';
      await sleep(800);

      await revealVagas(value);
    }

    async function revealVagas(value) {
      await botSay(`Consulta concluída. Há <strong>diversas vagas abertas para dentistas no ${escapeHtml(value)}</strong>.`, 950);

      const m = document.createElement('div');
      m.className = 'msg bot';
      m.innerHTML = `
        <div class="vagas-card">
          <div class="vagas-head"><i data-lucide="briefcase"></i><b>Vagas para dentista · ${escapeHtml(value)}</b></div>
          <div class="vagas-text">A <strong>Região Sul</strong> conta com <strong>vagas abertas para Cirurgião-Dentista</strong> em prefeituras, secretarias de saúde e órgãos estaduais.</div>
          <span class="vagas-salary"><i data-lucide="trending-up"></i>Remuneração acima de R$ 10 mil/mês</span>
        </div>`;
      log.appendChild(m);
      lucide.createIcons();
      scrollDown();
      await sleep(500);

      await botSay('Para encaminhar essas oportunidades e <strong>conectá-lo(a) com a nossa equipe</strong>, precisamos de algumas informações. Leva menos de um minuto.', 1100);
      await askNome();
    }

    async function askNome() {
      await botSay('Qual é o seu <strong>nome completo</strong>?', 750);
      showInput({
        type: 'text',
        placeholder: 'Seu nome completo',
        onSubmit: async (v) => {
          if (v.replace(/\s/g, '').length < 3) {
            await botSay('Por favor, informe o seu nome completo.', 600);
            return;
          }
          data.nome = v;
          addUser(v);
          hideInputs();
          await askTelefone();
        }
      });
    }

    async function askTelefone() {
      await botSay('Informe o seu <strong>telefone (WhatsApp)</strong> para contato.', 900);
      showInput({
        type: 'tel',
        phone: true,
        placeholder: '(DDD) 9 0000-0000',
        onSubmit: async (v) => {
          const digits = phoneDigits(v);
          if (digits.length < 8) {
            await botSay('O número informado parece incompleto. Confira o DDD e o número, por favor.', 650);
            return;
          }
          data.telefone = '+' + country.value + digits;
          addUser('+' + country.value + ' ' + v);
          hideInputs();
          await askEmail();
        }
      });
    }

    async function askEmail() {
      await botSay('Por fim, informe o seu melhor <strong>e-mail</strong>.', 900);
      showInput({
        type: 'email',
        placeholder: 'seu@email.com',
        onSubmit: async (v) => {
          if (!isEmail(v)) {
            await botSay('O e-mail informado não parece válido. Por favor, confira.', 650);
            return;
          }
          data.email = v;
          addUser(v);
          hideInputs();
          await finish();
        }
      });
    }

    async function finish() {
      // dispara o lead (Meta Pixel + webhook) assim que os dados estão completos
      fireMetaLead();
      sendWebhook();

      await botSay('Recebemos as suas informações. Confira abaixo se estão corretas:', 950);

      const m = document.createElement('div');
      m.className = 'msg bot';
      m.innerHTML = `
        <div class="summary">
          <div class="summary-row"><i data-lucide="user"></i><span><b>${escapeHtml(data.nome)}</b></span></div>
          <div class="summary-row"><i data-lucide="map-pin"></i><span>${escapeHtml(data.estado)}</span></div>
          <div class="summary-row"><i data-lucide="phone"></i><span>${escapeHtml(data.telefone)}</span></div>
          <div class="summary-row"><i data-lucide="mail"></i><span>${escapeHtml(data.email)}</span></div>
        </div>`;
      log.appendChild(m);
      lucide.createIcons();
      scrollDown();

      await botSay(`Obrigado. Em breve <strong>um membro da equipe do OdonConcursos entrará em contato</strong> para apresentar as <strong>melhores oportunidades</strong> de concurso no ${escapeHtml(data.estado)}.`, 1300);

      await botSay('Enquanto isso, você já pode <strong>consultar todos os concursos</strong> disponíveis:', 900);

      // botão CTA com o link de concursos
      const cta = document.createElement('div');
      cta.className = 'msg bot';
      cta.innerHTML = `
        <a class="cta-link" href="${CONCURSOS_URL}" target="_blank" rel="noopener">
          <i data-lucide="external-link"></i>Ver todos os concursos
        </a>`;
      log.appendChild(cta);
      lucide.createIcons();
      scrollDown();
    }

    /* ─── Meta Ads: evento de Lead ─── */
    function fireMetaLead() {
      try {
        if (typeof fbq === 'function') {
          fbq('track', 'Lead', {
            content_name: 'Concursos Odontologia - Região Sul',
            content_category: data.estado
          });
        }
      } catch (err) {
        console.error('Meta Pixel error:', err);
      }
    }

    /* ─── Webhook: envia nome, email, telefone, estado ─── */
    async function sendWebhook() {
      const now = new Date();
      const payload = {
        formulario: FORMULARIO,
        nome: data.nome,
        email: data.email,
        telefone: data.telefone,
        estado: data.estado,
        sigla_estado: data.sigla,
        regiao: 'Sul',
        origem: 'Chat captura OdonConcursos - Sul',
        data_contato: now.toISOString(),
        data_contato_br: now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR'),
        ...tracking
      };
      try {
        if (WEBHOOK_URL) {
          await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } else {
          console.log('Lead (configure WEBHOOK_URL):', payload);
        }
      } catch (err) {
        console.error('Webhook error:', err);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
      ));
    }

    start();
  </script>

</body>
</html>
