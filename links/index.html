<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" content="#ffffff" />
  <title>Preparatórios abertos · OdonConcursos</title>
  <meta name="description" content="Escolha o seu concurso de Odontologia: PM BA, PM PE, TRT 8, Petrobras, Porto Velho e SES-RJ. Preparatórios direcionados para a banca de cada prova." />
  <meta property="og:title" content="Preparatórios abertos · OdonConcursos" />
  <meta property="og:description" content="Escolha o seu concurso de Odontologia e comece a estudar hoje." />
  <meta property="og:image" content="https://odonconcursos.com.br/assets/img/logo.png" />

  <!-- Meta Pixel Code -->
  <script>

    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root, html, body { color-scheme: light only; background: #fff; }
    :root {
      --pink: #e91e8c;
      --pink-soft: #f472b6;
      --pink-tint: #fde7f2;
      --navy: #0b1535;
      --text: #0b1535;
      --mute: #5b6382;
      --line: #e8e9f0;
      --card: #ffffff;
      --bg: #f7f7fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(120% 60% at 50% -10%, #fde7f2 0%, rgba(253,231,242,0) 60%),
        var(--bg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 40px 16px 48px; }

    header { text-align: center; margin-bottom: 28px; }
    .logo {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--navy);
      display: grid; place-items: center;
      margin: 0 auto 16px;
      box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--pink-tint), 0 12px 30px rgba(233,30,140,.25);
    }
    .logo img { width: 64px; height: auto; display: block; }
    h1 { font-size: 24px; font-weight: 900; letter-spacing: -.02em; line-height: 1.2; }
    .g1 {
      background: linear-gradient(90deg, var(--pink), #ff6fb5);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { margin-top: 8px; font-size: 15px; color: var(--mute); line-height: 1.5; }

    .list { display: flex; flex-direction: column; gap: 12px; }
    .item {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      text-decoration: none; color: inherit;
      box-shadow: 0 1px 2px rgba(11,21,53,.04), 0 6px 18px rgba(11,21,53,.05);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .item:hover, .item:focus-visible {
      transform: translateY(-2px) scale(1.01);
      border-color: var(--pink-soft);
      box-shadow: 0 0 0 3px var(--pink-tint), 0 10px 28px rgba(233,30,140,.18);
      outline: none;
    }
    .badge {
      flex: 0 0 52px; height: 52px; border-radius: 14px;
      background: var(--navy); color: #fff;
      display: grid; place-items: center;
      font-weight: 900; font-size: 13px; letter-spacing: -.01em; text-align: center; line-height: 1.05;
    }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 800; font-size: 16px; line-height: 1.25; }
    .meta { margin-top: 3px; font-size: 13px; color: var(--mute); line-height: 1.4; }
    .meta b { color: var(--pink); font-weight: 700; }
    .go {
      flex: 0 0 auto; width: 36px; height: 36px; border-radius: 999px;
      display: grid; place-items: center;
      background: radial-gradient(circle at 30% 30%, #ff5fb0, var(--pink));
      box-shadow: 0 0 0 3px var(--pink-tint), 0 4px 14px rgba(233,30,140,.4);
      color: #fff;
    }
    .item::before {
      content: ""; position: absolute; top: 0; left: -60%;
      width: 40%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.7), transparent);
      transform: skewX(-20deg);
      animation: shine 5s ease-in-out infinite;
      pointer-events: none;
    }
    .item:nth-child(2)::before { animation-delay: .4s; }
    .item:nth-child(3)::before { animation-delay: .8s; }
    .item:nth-child(4)::before { animation-delay: 1.2s; }
    .item:nth-child(5)::before { animation-delay: 1.6s; }
    .item:nth-child(6)::before { animation-delay: 2s; }
    @keyframes shine { 0%, 70% { left: -60%; } 100% { left: 130%; } }

    .fade { opacity: 0; transform: translateY(12px); animation: fadeSlideIn .55s ease forwards; }
    @keyframes fadeSlideIn { to { opacity: 1; transform: none; } }

    footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--mute); }
    footer a { color: var(--mute); }

    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; opacity: 1; transform: none; }
      .item::before { animation: none; display: none; }
      .item { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="fade">
      <div class="logo"><img src="https://odonconcursos.com.br/assets/img/logo.png" alt="OdonConcursos" /></div>
      <h1>Escolha o seu <span class="g1">concurso</span></h1>
      <p class="sub">Preparatórios de Odontologia direcionados para a banca de cada prova.</p>
    </header>

    <nav class="list" id="lista" aria-label="Preparatórios"></nav>

    <footer class="fade" style="animation-delay:.9s">
      © OdonConcursos · <a href="https://odonconcursos.com.br" target="_blank" rel="noopener">odonconcursos.com.br</a>
    </footer>
  </main>

  <script>
    // Ordem dos botões = ordem desta lista.
    const LINKS = [
      { sigla: 'PM<br>BA', nome: 'PM BA e CBM BA', banca: 'AOCP', prova: '17/01/2027', url: '/lp/concurso/pm-ba-vendas/' },
      { sigla: 'PM<br>PE', nome: 'PM PE · Oficial Dentista', banca: 'AOCP', prova: '21/02/2027', url: '/lp/concurso/pm-pe-vendas/' },
      { sigla: 'TRT<br>8', nome: 'TRT 8 · Analista Judiciário', banca: 'FCC', prova: '17/01/2027', url: '/lp/concurso/trt8-vendas/' },
      { sigla: 'PB', nome: 'Petrobras / Transpetro', banca: 'Cesgranrio', prova: '29/11/2026', url: '/lp/concurso/petrobras-vendas/' },
      { sigla: 'PVH', nome: 'Porto Velho RO · SEMUSA', banca: 'IBGP', prova: '13/12/2026', url: '/lp/concurso/porto-velho-vendas/' },
      { sigla: 'SES<br>RJ', nome: 'SES-RJ · Odontólogo', banca: 'IBDO', prova: '01/11/2026', url: '/lp/concurso/ses-rj-vendas/' },
    ];

    // Repassa UTMs/fbclid da bio para a página de vendas.
    const qs = location.search;
    const arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    const lista = document.getElementById('lista');
    LINKS.forEach((l, i) => {
      const a = document.createElement('a');
      a.className = 'item fade';
      a.style.animationDelay = (0.15 + i * 0.08) + 's';
      a.href = l.url + qs;
      a.innerHTML =
        '<span class="badge">' + l.sigla + '</span>' +
        '<span class="info"><span class="name">' + l.nome + '</span>' +
        '<span class="meta" style="display:block">Banca ' + l.banca + ' · prova em <b>' + l.prova + '</b></span></span>' +
        '<span class="go">' + arrow + '</span>';
      a.addEventListener('click', () => {
        if (window.fbq) fbq('trackCustom', 'LinkClick', { content_name: l.nome });
      });
      lista.appendChild(a);
    });
  </script>
</body>
</html>
