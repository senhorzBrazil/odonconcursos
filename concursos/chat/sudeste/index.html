<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    :root {
      --bg:           #eef1f7;
      --bg-soft:      #f1f3f9;
      --bg-card:      #ffffff;
      --line:         rgba(11,21,53,0.10);
      --line-strong:  rgba(11,21,53,0.18);
      --text:         #0b1535;
      --text-mute:    #475569;
      --text-dim:     #64748b;
      --text-faint:   #94a3b8;

      --lime:         #e91e8c;
      --lime-soft:    #f472b6;
      --green:        #1a3a6e;
      --orange:       #e91e8c;
      --orange-2:     #f0309a;

      --sans:    'Roboto', system-ui, sans-serif;
      --display: 'Roboto Slab', 'Roboto', system-ui, serif;
    }

    @keyframes pulseGlow { 0%,100% { opacity:.5; } 50% { opacity:1; } }
    @keyframes bubbleIn  { from { opacity:0; transform: translateY(12px) scale(.98); } to { opacity:1; transform: translateY(0) scale(1); } }
    @keyframes blink     { 0%,80%,100% { opacity:.25; transform: translateY(0); } 40% { opacity:1; transform: translateY(-3px); } }
    @keyframes barPulse  { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes spin      { to { transform: rotate(360deg); } }
    @keyframes loadFill  { from { width: 4%; } to { width: 100%; } }
    @keyframes dash      { to { background-position: 22px 0; } }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    html::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(at 20% 80%, #0b1535 1px, transparent 0);
      background-size: 3px 3px;
      pointer-events: none;
      opacity: .05;
      z-index: 1;
    }
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
    .orb-1 {
      width: 700px; height: 700px; top: -240px; right: -120px;
      background: radial-gradient(circle, rgba(233,30,140,.10), transparent 70%);
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .orb-2 {
      width: 500px; height: 500px; bottom: 6%; left: -160px;
      background: radial-gradient(circle, rgba(26,58,110,.06), transparent 70%);
      animation: pulseGlow 12s ease-in-out infinite reverse;
    }

    /* ─── CHAT SHELL ─── */
    .chat {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 460px;
      height: min(760px, 92svh);
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(11,21,53,.16), 0 0 30px rgba(233,30,140,.08);
    }
    .chat-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--lime), var(--lime-soft), var(--lime));
      background-size: 200% 100%;
      animation: barPulse 4s ease-in-out infinite;
    }

    /* header */
    .chat-head {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    .chat-logo-plate {
      height: 44px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chat-logo-plate img { height: 28px; width: auto; display: block; }
    .chat-logo-fallback { font-family: var(--display); font-size: 16px; font-weight: 800; color: var(--lime); line-height: 1; letter-spacing: -.01em; }
    .chat-id { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .chat-name { font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.1; }
    .chat-status { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
    .chat-status b { color: #16a34a; font-weight: 600; }
    .chat-tag {
      margin-left: auto; flex-shrink: 0;
      font-size: 9px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
      color: var(--lime); opacity: .9;
      border: 1px solid rgba(233,30,140,.3);
      background: rgba(233,30,140,.06);
      padding: 5px 10px; border-radius: 999px;
    }

    /* messages */
    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .chat-log::-webkit-scrollbar { width: 6px; }
    .chat-log::-webkit-scrollbar-thumb { background: rgba(11,21,53,.14); border-radius: 999px; }

    .msg { display: flex; max-width: 84%; animation: bubbleIn .35s ease-out both; }
    .msg.bot  { align-self: flex-start; }
    .msg.user { align-self: flex-end; justify-content: flex-end; }
    .bubble {
      padding: 12px 16px;
      font-size: 14.5px;
      line-height: 1.55;
      border-radius: 18px;
    }
    .bubble strong { font-weight: 700; color: var(--text); }
    .msg.user .bubble strong { color: #fff; }
    .msg.bot .bubble {
      background: var(--bg-soft);
      border: 1px solid var(--line);
      color: var(--text);
      border-bottom-left-radius: 6px;
    }
    .msg.user .bubble {
      background: linear-gradient(92deg, var(--lime) 0%, var(--lime-soft) 100%);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(233,30,140,.25);
    }

    /* typing indicator */
    .typing .bubble { display: flex; gap: 5px; padding: 15px 18px; }
    .typing .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); animation: blink 1.3s infinite; }
    .typing .dot:nth-child(2) { animation-delay: .18s; }
    .typing .dot:nth-child(3) { animation-delay: .36s; }

    /* footer / input zone */
    .chat-foot {
      border-top: 1px solid var(--line);
      padding: 14px 16px 16px;
      background: #f7f9fc;
    }

    /* quick reply chips — inside the chat, aligned to the user's side */
    .msg.options { align-self: stretch; max-width: 100%; justify-content: flex-end; }
    .options-wrap {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: flex-end;
      width: 100%;
    }
    .chip {
      flex: 0 1 auto;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 18px;
      border: 1.5px solid rgba(233,30,140,.5);
      background: rgba(233,30,140,.08);
      color: var(--text);
      border-radius: 999px;
      font-family: var(--sans);
      font-size: 13.5px; font-weight: 600;
      cursor: pointer;
      transition: background .18s, border-color .18s, transform .12s, box-shadow .18s;
      white-space: nowrap;
      text-align: left;
    }
    .chip svg { width: 15px; height: 15px; stroke: var(--lime); fill: none; stroke-width: 2.2; flex-shrink: 0; }
    .chip:hover {
      background: rgba(233,30,140,.18);
      border-color: var(--lime);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(233,30,140,.22);
    }
    .chip:active { transform: scale(.97); }
    /* chip largo (lista de concursos empilhada) */
    .chip.chip-wide {
      flex: 1 1 100%;
      white-space: normal;
      justify-content: flex-start;
      border-radius: 14px;
      padding: 13px 16px;
      line-height: 1.3;
    }

    /* text input bar */
    .input-bar { display: flex; align-items: center; gap: 8px; }
    .input-bar.hidden { display: none; }
    .country-select {
      flex-shrink: 0;
      width: 84px;
      background: #ffffff;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 13px 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      text-align: center;
      outline: none;
      transition: border-color .2s;
    }
    .country-select.hidden { display: none; }
    .field {
      flex: 1;
      background: #ffffff;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 14px 18px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14.5px;
      outline: none;
      transition: border-color .2s;
    }
    .field::placeholder { color: var(--text-faint); }
    .field:focus { border-color: rgba(233,30,140,.5); }
    .send-btn {
      flex-shrink: 0;
      width: 48px; height: 48px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(38.67% 91.17% at 50% 8.83%, var(--orange) 0, var(--orange-2) 100%);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(233,30,140,.4);
      transition: filter .2s, transform .12s;
    }
    .send-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .send-btn:hover { filter: brightness(1.1); transform: scale(1.05); }
    .send-btn:active { transform: scale(.96); }

    .foot-secure {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      font-size: 11px; color: var(--text-faint);
      margin-top: 12px;
    }
    .foot-secure svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* loading vagas card */
    .loading-card {
      border: 1px solid rgba(233,30,140,.3);
      background:
        radial-gradient(circle at 15% 0%, rgba(233,30,140,.10), transparent 60%),
        rgba(233,30,140,.04);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex; flex-direction: column; gap: 12px;
      margin-top: 2px;
    }
    .loading-head { display: flex; align-items: center; gap: 10px; }
    .loading-head .spin {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 2.5px solid rgba(233,30,140,.22);
      border-top-color: var(--lime);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loading-head b { font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--text); }
    .loading-track { height: 8px; border-radius: 999px; background: rgba(11,21,53,.08); overflow: hidden; }
    .loading-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--lime), var(--lime-soft));
      animation: loadFill 2.1s ease-out forwards;
    }
    .loading-step { font-size: 12.5px; color: var(--text-dim); display: flex; align-items: center; gap: 7px; }
    .loading-step svg { width: 13px; height: 13px; stroke: var(--lime); fill: none; stroke-width: 2; flex-shrink: 0; }

    /* card do concurso escolhido */
    .vagas-card {
      border: 1px solid rgba(233,30,140,.3);
      background:
        radial-gradient(circle at 15% 0%, rgba(233,30,140,.10), transparent 60%),
        rgba(233,30,140,.04);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex; flex-direction: column; gap: 10px;
      margin-top: 2px;
    }
    .vagas-head { display: flex; align-items: flex-start; gap: 9px; }
    .vagas-head svg { width: 17px; height: 17px; stroke: var(--lime); fill: none; stroke-width: 2; flex-shrink: 0; margin-top: 2px; }
    .vagas-head b { font-family: var(--display); font-size: 14.5px; font-weight: 700; color: var(--text); line-height: 1.25; }
    .vagas-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge {
      font-size: 10.5px; font-weight: 600;
      padding: 4px 9px; border-radius: 999px;
      border: 1px solid var(--line-strong);
      color: var(--text-mute); background: var(--bg-soft);
    }
    .badge.open { color: #16a34a; border-color: rgba(22,163,74,.35); background: rgba(22,163,74,.08); }
    .badge.soon { color: var(--lime); border-color: rgba(233,30,140,.3); background: rgba(233,30,140,.06); }
    .vagas-text { font-size: 13.5px; line-height: 1.55; color: var(--text-mute); }
    .vagas-text strong { color: var(--text); font-weight: 600; }
    .vagas-salary {
      display: inline-flex; align-items: center; gap: 7px;
      align-self: flex-start;
      font-size: 13px; font-weight: 700; color: var(--text);
      border: 1px solid rgba(22,163,74,.35);
      background: rgba(22,163,74,.08);
      padding: 7px 12px; border-radius: 999px;
    }
    .vagas-salary svg { width: 14px; height: 14px; stroke: #16a34a; fill: none; stroke-width: 2; }

    /* card de outras oportunidades */
    .opps-card {
      border: 1px solid rgba(233,30,140,.3);
      background:
        radial-gradient(circle at 15% 0%, rgba(233,30,140,.08), transparent 60%),
        rgba(233,30,140,.03);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex; flex-direction: column; gap: 10px;
      margin-top: 2px;
    }
    .opps-head { display: flex; align-items: center; gap: 9px; }
    .opps-head svg { width: 17px; height: 17px; stroke: var(--lime); fill: none; stroke-width: 2; flex-shrink: 0; }
    .opps-head b { font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--text); }
    .opp-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 11px;
    }
    .opp-icon {
      width: 30px; height: 30px; flex-shrink: 0;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(233,30,140,.08);
      border: 1px solid rgba(233,30,140,.2);
    }
    .opp-icon svg { width: 15px; height: 15px; stroke: var(--lime); fill: none; stroke-width: 2; }
    .opp-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .opp-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.25; }
    .opp-meta { font-size: 11px; color: var(--text-dim); }
    .opp-uf { font-weight: 800; color: var(--lime); }
    .opp-sal { font-size: 11.5px; font-weight: 700; color: #16a34a; text-align: right; flex-shrink: 0; max-width: 38%; line-height: 1.3; }

    /* summary card (final) */
    .summary {
      border: 1px solid rgba(233,30,140,.3);
      background: rgba(233,30,140,.05);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex; flex-direction: column; gap: 10px;
      margin-top: 2px;
    }
    .summary-row { display: flex; align-items: center; gap: 11px; font-size: 13.5px; color: var(--text-mute); }
    .summary-row svg { width: 15px; height: 15px; stroke: var(--lime); fill: none; stroke-width: 2; flex-shrink: 0; }
    .summary-row b { color: var(--text); font-weight: 600; }

    /* ─── cupom ─── */
    .coupon {
      position: relative;
      border: 1.5px dashed var(--lime);
      background:
        radial-gradient(circle at 12% 0%, rgba(233,30,140,.12), transparent 55%),
        rgba(233,30,140,.05);
      border-radius: 16px;
      padding: 18px 18px 16px;
      display: flex; flex-direction: column; gap: 8px;
      margin-top: 2px;
      overflow: hidden;
    }
    .coupon::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
      background: repeating-linear-gradient(90deg, var(--lime) 0 11px, transparent 11px 22px);
      background-size: 22px 5px;
      animation: dash 1.2s linear infinite;
      opacity: .8;
    }
    .coupon-tag {
      align-self: flex-start;
      font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800;
      color: var(--lime);
      border: 1px solid rgba(233,30,140,.4);
      background: rgba(233,30,140,.08);
      padding: 4px 10px; border-radius: 999px;
    }
    .coupon-title { font-family: var(--display); font-size: 17px; font-weight: 800; color: var(--text); line-height: 1.2; }
    .coupon-sub { font-size: 13px; line-height: 1.5; color: var(--text-mute); }
    .coupon-sub strong { color: var(--text); font-weight: 700; }
    .coupon-code {
      align-self: flex-start;
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--display); font-size: 15px; font-weight: 800; letter-spacing: .06em;
      color: var(--text);
      border: 1.5px solid rgba(233,30,140,.4);
      background: #fff;
      padding: 8px 14px; border-radius: 10px;
      margin-top: 2px;
    }
    .coupon-code svg { width: 15px; height: 15px; stroke: var(--lime); fill: none; stroke-width: 2; }

    /* CTA WhatsApp */
    .cta-link {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      margin-top: 4px;
      padding: 15px 20px;
      border-radius: 14px;
      background: linear-gradient(92deg, #25D366 0%, #1ebe5b 100%);
      color: #fff;
      font-family: var(--sans);
      font-size: 14.5px; font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(37,211,102,.35);
      transition: filter .2s, transform .12s;
    }
    .cta-link svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .cta-link:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .cta-link:active { transform: scale(.98); }

    @media (max-width: 520px) {
      body { padding: 0; }
      .chat { max-width: 100%; height: 100svh; border-radius: 0; border: none; }
    }
  </style>
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="chat" role="dialog" aria-label="Atendimento OdonConcursos">
    <div class="chat-bar"></div>

    <header class="chat-head">
      <div class="chat-logo-plate">
        <img src="https://odonconcursos.com.br/assets/img/logo.png" alt="OdonConcursos"
             onerror="this.outerHTML='<span class=&quot;chat-logo-fallback&quot;>ODON</span>'">
      </div>
      <div class="chat-id">
        <div class="chat-name">Equipe OdonConcursos</div>
        <div class="chat-status"><b>● online</b> · responde na hora</div>
      </div>
      <span class="chat-tag">Região Sudeste</span>
    </header>

    <div class="chat-log" id="log" aria-live="polite"></div>

    <footer class="chat-foot">
      <form class="input-bar hidden" id="inputBar" autocomplete="off">
        <select class="country-select hidden" id="country">
          <option value="55" selected>🇧🇷 +55</option>
          <option value="351">🇵🇹 +351</option>
          <option value="1">🇺🇸 +1</option>
          <option value="44">🇬🇧 +44</option>
          <option value="54">🇦🇷 +54</option>
        </select>
        <input class="field" id="field" type="text" placeholder="Digite aqui…" aria-label="Sua resposta" />
        <button class="send-btn" id="send" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>

      <div class="foot-secure">
        <i data-lucide="lock"></i>
        <span>Seus dados estão seguros</span>
      </div>
    </footer>
  </div>

  <script>
    lucide.createIcons();

    /* ════════════════════════════════════════════════════════════════
       CONFIGURAÇÃO  —  edite aqui
       ════════════════════════════════════════════════════════════════ */

    // 1) ►► COLE AQUI a URL do seu webhook (Make / n8n / Zapier / CRM…)
    //    É pra cá que os dados são enviados quando o usuário conclui o chat.
    //    Deixe entre as aspas. Ex.: 'https://hook.us2.make.com/xxxxxxxx'
    const WEBHOOK_URL = '';

    // 2) Pixel do Meta Ads — dispara PageView no <head> ao carregar a página
    const META_PIXEL_ID = '3213093405602824';

    // 3) ► NÚMERO DO WHATSAPP que vai receber o lead/cupom.
    //    Formato internacional, só dígitos: 55 + DDD + número.
    //    >>> TROQUE pelo seu número real <<<
    const WHATSAPP_NUMERO = '5519994565534';

    // 4) Identificador deste formulário (enviado ao webhook).
    const FORMULARIO = 'Região Sudeste · Cupom';

    /* Concursos ABERTOS e PREVISTOS da Região Sudeste, por estado.
       Cada concurso tem um cupom específico (campo "cupom"). */
    const ESTADOS = {
      'Rio de Janeiro': {
        sigla: 'RJ',
        concursos: [

    /* ════════════════════════════════════════════════════════════════ */

    const log      = document.getElementById('log');
    const inputBar = document.getElementById('inputBar');
    const field    = document.getElementById('field');
    const country  = document.getElementById('country');

    const data = {
      estado: '', sigla: '',
      concurso_id: '', concurso: '', cupom: '',
      q_remuneracao: '', q_preparo: '', q_direcionada: '', q_interesse: '',
      nome: '', telefone: '', email: ''
    };

    // Captura UTMs e IDs de clique da URL no carregamento da página
    const tracking = (() => {
      const p = new URLSearchParams(window.location.search);
      const get = (k) => p.get(k) || '';
      return {
        utm_source:   get('utm_source'),
        utm_medium:   get('utm_medium'),
        utm_campaign: get('utm_campaign'),
        utm_content:  get('utm_content'),
        utm_term:     get('utm_term'),
        fbclid:       get('fbclid'),
        gclid:        get('gclid'),
        referrer:     document.referrer || '',
        landing_url:  window.location.href
      };
    })();

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const scrollDown = () => { log.scrollTop = log.scrollHeight; };

    function addUser(text) {
      const m = document.createElement('div');
      m.className = 'msg user';
      m.innerHTML = `<div class="bubble"></div>`;
      m.querySelector('.bubble').textContent = text;
      log.appendChild(m);
      scrollDown();
    }

    function addBotHTML(html) {
      const m = document.createElement('div');
      m.className = 'msg bot';
      m.innerHTML = `<div class="bubble">${html}</div>`;
      log.appendChild(m);
      lucide.createIcons();
      scrollDown();
    }

    async function botSay(html, delay = 750) {
      const t = document.createElement('div');
      t.className = 'msg bot typing';
      t.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
      log.appendChild(t);
      scrollDown();
      await sleep(delay);
      t.remove();
      addBotHTML(html);
    }

    function hideInputs() {
      inputBar.classList.add('hidden');
    }

    function showChips(options, { wide = false } = {}) {
      hideInputs();
      const m = document.createElement('div');
      m.className = 'msg options';
      const wrap = document.createElement('div');
      wrap.className = 'options-wrap';
      options.forEach(opt => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (wide ? ' chip-wide' : '');
        b.innerHTML = `<i data-lucide="${opt.icon}"></i><span>${opt.label}</span>`;
        b.addEventListener('click', () => {
          m.remove();
          opt.onPick(opt.value, opt.pickLabel || opt.label);
        });
        wrap.appendChild(b);
      });
      m.appendChild(wrap);
      log.appendChild(m);
      lucide.createIcons();
      scrollDown();
    }

    // pergunta com chips que devolve uma Promise com a opção escolhida
    function askChips(options) {
      return new Promise(resolve => {
        showChips(options.map(o => ({
          label: o.label,
          value: o.value,
          icon: o.icon || 'circle',
          onPick: (value, label) => resolve({ value, label })
        })));
      });
    }

    let activeHandler = null;
    function showInput({ type = 'text', placeholder = 'Digite aqui…', phone = false, onSubmit }) {
      hideInputs();
      inputBar.classList.remove('hidden');
      field.type = type;
      field.placeholder = placeholder;
      field.value = '';
      field.inputMode = (type === 'tel') ? 'numeric' : (type === 'email' ? 'email' : 'text');
      field.dataset.mask = phone ? 'tel' : '';
      country.classList.toggle('hidden', !phone);
      activeHandler = onSubmit;
      setTimeout(() => field.focus(), 60);
      scrollDown();
    }

    inputBar.addEventListener('submit', (e) => {
      e.preventDefault();
      if (activeHandler) activeHandler(field.value.trim());
    });

    // máscara de telefone (formato brasileiro) enquanto digita: (XX) XXXXX-XXXX
    function maskTelBR(v) {
      const d = v.replace(/\D/g, '').slice(0, 11);
      const len = d.length;
      if (len === 0)  return '';
      if (len <= 2)   return '(' + d;
      if (len <= 6)   return '(' + d.slice(0, 2) + ') ' + d.slice(2);
      if (len <= 10)  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
      return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
    }
    field.addEventListener('input', () => {
      if (field.dataset.mask !== 'tel') return;
      // só mascara para o Brasil (+55); outros países ficam livres
      if (country.value === '55') field.value = maskTelBR(field.value);
    });
    country.addEventListener('change', () => {
      if (field.dataset.mask !== 'tel') return;
      field.value = (country.value === '55') ? maskTelBR(field.value) : field.value.replace(/[()\-\s]/g, '');
    });

    /* ─── validators ─── */
    const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    const phoneDigits = (v) => v.replace(/\D/g, '');

    /* ─── conversation flow ─── */
    async function start() {
      await botSay('Olá! Aqui é a equipe do <strong>OdonConcursos</strong>. 👋', 650);
      await botSay('A <strong>Região Sudeste</strong> está vivendo um dos melhores momentos para <strong>concursos públicos de Odontologia</strong> — são vários editais abertos e previstos, com ótimas remunerações.', 1400);
      await askEstado();
    }

    async function askEstado() {
      await botSay('Vou te mostrar as oportunidades do seu estado. Em qual <strong>estado da Região Sudeste</strong> você atua?', 850);
      showChips([
        { label: 'São Paulo',      value: 'São Paulo',      icon: 'map-pin', onPick: pickEstado },
        { label: 'Rio de Janeiro', value: 'Rio de Janeiro', icon: 'map-pin', onPick: pickEstado },
        { label: 'Minas Gerais',   value: 'Minas Gerais',   icon: 'map-pin', onPick: pickEstado },
        { label: 'Espírito Santo', value: 'Espírito Santo', icon: 'map-pin', onPick: pickEstado },
      ]);
    }

    async function pickEstado(value, label) {
      data.estado = value;
      data.sigla = (ESTADOS[value] && ESTADOS[value].sigla) || '';
      addUser(label);
      hideInputs();
      await askNome();
    }

    async function askNome() {
      await botSay('Boa escolha! E como posso te chamar?', 850);
      showInput({
        type: 'text',
        placeholder: 'Seu nome',
        onSubmit: async (v) => {
          const nome = v.trim();
          if (nome.replace(/\s/g, '').length < 2) {
            await botSay('Pode me dizer o seu nome? 🙂', 600);
            return;
          }
          data.nome = nome;
          addUser(nome);
          hideInputs();
          await botSay(`Prazer, <strong>${escapeHtml(nome.split(' ')[0])}</strong>! 😃`, 700);
          await searchConcursos(data.estado);
        }
      });
    }

    async function searchConcursos(estado) {
      await botSay(`Certo. Vou <strong>pesquisar os concursos disponíveis no ${escapeHtml(estado)}</strong>.`, 850);

      const card = document.createElement('div');
      card.className = 'msg bot';
      card.innerHTML = `
        <div class="loading-card">
          <div class="loading-head"><span class="spin"></span><b>Buscando concursos no ${escapeHtml(estado)}</b></div>
          <div class="loading-track"><div class="loading-fill"></div></div>
          <div class="loading-step" id="loadStepEstado"><i data-lucide="search"></i><span>Varrendo editais abertos</span></div>
        </div>`;
      log.appendChild(card);
      lucide.createIcons();
      scrollDown();

      const stepEl = card.querySelector('#loadStepEstado span');
      await sleep(800);
      stepEl.textContent = 'Verificando editais previstos';
      await sleep(800);
      stepEl.textContent = 'Filtrando vagas para Cirurgião-Dentista';
      await sleep(800);

      await askConcurso(estado);
    }

    async function askConcurso(estado) {
      const lista = (ESTADOS[estado] && ESTADOS[estado].concursos) || [];
      await botSay(`No <strong>${escapeHtml(estado)}</strong> temos os seguintes concursos <strong>abertos e previstos</strong>. Qual deles te interessa?`, 950);
      showChips(
        lista.map(c => ({
          label: `${c.nome} <span style="display:block;font-size:11.5px;font-weight:600;color:var(--lime);margin-top:3px;">${c.statusLabel}</span>`,
          pickLabel: c.nome,
          value: c.id,
          icon: 'briefcase',
          onPick: (id) => pickConcurso(estado, id)
        })),
        { wide: true }
      );
    }

    function findConcurso(estado, id) {
      const lista = (ESTADOS[estado] && ESTADOS[estado].concursos) || [];
      return lista.find(c => c.id === id) || null;
    }

    async function pickConcurso(estado, id) {
      const c = findConcurso(estado, id);
      if (!c) return;
      data.concurso_id = c.id;
      data.concurso = c.nome;
      data.cupom = c.cupom;
      addUser(c.nome);
      hideInputs();

      await botSay(`Ótima escolha. Vou puxar os detalhes do <strong>${escapeHtml(c.nome)}</strong>.`, 850);
      await loadConcurso(c);
    }

    async function loadConcurso(c) {
      const card = document.createElement('div');
      card.className = 'msg bot';
      card.innerHTML = `
        <div class="loading-card">
          <div class="loading-head"><span class="spin"></span><b>Consultando ${escapeHtml(c.nome)}</b></div>
          <div class="loading-track"><div class="loading-fill"></div></div>
          <div class="loading-step" id="loadStep"><i data-lucide="search"></i><span>Verificando edital e vagas</span></div>
        </div>`;
      log.appendChild(card);
      lucide.createIcons();
      scrollDown();

      const stepEl = card.querySelector('#loadStep span');
      await sleep(800);
      stepEl.textContent = 'Filtrando vagas para Cirurgião-Dentista';
      await sleep(800);
      stepEl.textContent = 'Localizando cupom exclusivo';
      await sleep(800);

      await revealConcurso(c);
    }

    async function revealConcurso(c) {
      await botSay('Encontrei. Veja o resumo:', 800);

      const m = document.createElement('div');
      m.className = 'msg bot';
      m.innerHTML = `
        <div class="vagas-card">
          <div class="vagas-head"><i data-lucide="briefcase"></i><b>${escapeHtml(c.nome)}</b></div>
          <div class="vagas-badges">
            <span class="badge ${c.status}">${escapeHtml(c.statusLabel)}</span>
            ${c.banca && c.banca !== '—' ? `<span class="badge">Banca ${escapeHtml(c.banca)}</span>` : ''}
          </div>
          <div class="vagas-text">${c.texto}</div>
          ${c.salario ? `<span class="vagas-salary"><i data-lucide="trending-up"></i>${escapeHtml(c.salario)}</span>` : ''}
        </div>`;
      log.appendChild(m);
      lucide.createIcons();
      scrollDown();
      await sleep(500);

      await qualificar(c);
    }

    /* ─── outras oportunidades do Sudeste ─── */
    function allConcursos() {
      const out = [];
      Object.keys(ESTADOS).forEach(estado => {
        const e = ESTADOS[estado];
        (e.concursos || []).forEach(c => out.push({ ...c, estado, sigla: e.sigla }));
      });
      return out;
    }

    function outrasOportunidades(excludeId, n = 5) {
      const todos = allConcursos().filter(c => c.id !== excludeId);
      const comSalario = todos.filter(c => c.salario);
      const semSalario = todos.filter(c => !c.salario);
      return comSalario.concat(semSalario).slice(0, n);
    }

    async function mostrarOportunidades(c) {
      await botSay(`E não é só esse: a <strong>Região Sudeste está cheia de boas oportunidades</strong> para dentista — vagas abertas e previstas em vários municípios. Veja alguns exemplos além do ${escapeHtml(c.nome)}:`, 1200);

      const itens = outrasOportunidades(c.id, 5).map(o => `
        <div class="opp-item">
          <div class="opp-icon"><i data-lucide="briefcase"></i></div>
          <div class="opp-body">
            <div class="opp-name">${escapeHtml(o.nome)}</div>
            <div class="opp-meta"><span class="opp-uf">${escapeHtml(o.sigla)}</span> · ${escapeHtml(o.statusLabel)}</div>
          </div>
          ${o.salario ? `<span class="opp-sal">${escapeHtml(o.salario)}</span>` : ''}
        </div>`).join('');

      const m = document.createElement('div');
      m.className = 'msg bot';
      m.innerHTML = `
        <div class="opps-card">
          <div class="opps-head"><i data-lucide="layers"></i><b>Outras oportunidades no Sudeste</b></div>
          ${itens}
        </div>`;
      log.appendChild(m);
      lucide.createIcons();
      scrollDown();
      await sleep(600);

      await botSay('O Sudeste está vivendo o <strong>melhor momento pra Odontologia em anos</strong>.', 950);
    }

    // monta a frase da banca (trata "a definir" / "várias")
    function bancaFrase(c) {
      const b = (c.banca || '').trim();
      if (!b || b === 'a definir' || b === 'várias' || b === '—') return 'pra essa banca';
      return `pra banca <strong>${escapeHtml(b)}</strong>`;
    }

    /* ─── sequência de qualificação (antes de coletar os dados) ─── */
    async function qualificar(c) {
      // ── DESEJO: status do edital + a remuneração como prêmio ──
      const statusFrase = c.status === 'open'
        ? `Boa notícia: o edital da <strong>${escapeHtml(c.nome)}</strong> está <strong>com as inscrições abertas</strong> — dá pra entrar agora.`
        : `O edital da <strong>${escapeHtml(c.nome)}</strong> está <strong>${escapeHtml(c.statusLabel.toLowerCase())}</strong> — ou seja, ainda dá tempo de sair na frente da concorrência.`;
      await botSay(statusFrase, 1000);

      if (c.salario) {
        await botSay(`E olha a remuneração: <strong>${escapeHtml(c.salario)}</strong>. É um dos melhores salários pra dentista na região.`, 1150);
      } else {
        await botSay('E a remuneração pra Cirurgião-Dentista no Sudeste está entre as <strong>mais atrativas do país</strong>.', 1150);
      }
      await botSay('Uma vaga dessas mudaria a sua rotina, né?', 900);
      let a = await askChips([
        { label: 'Mudaria muito', value: 'mudaria_muito', icon: 'trending-up' },
        { label: 'Com certeza',   value: 'com_certeza',   icon: 'thumbs-up' },
      ]);
      addUser(a.label); data.q_remuneracao = a.label;

      // ── AMPLIAÇÃO: a região está cheia de oportunidades ──
      await mostrarOportunidades(c);

      // ── PROBLEMA / GAP: o que separa quem passa de quem não passa ──
      await botSay('Agora vou ser direto com você: <strong>a concorrência por essas vagas só cresce</strong>. Quem é aprovado não é quem estuda mais — é quem estuda <strong>direcionado pra banca certa</strong>.', 1300);

      await botSay('Me conta: você <strong>já está se preparando</strong> para esse concurso?', 950);
      a = await askChips([
        { label: 'Já estou estudando', value: 'sim', icon: 'book-open' },
        { label: 'Ainda não comecei',  value: 'nao', icon: 'clock' },
      ]);
      addUser(a.label); data.q_preparo = a.label;
      const jaEstuda = (a.value === 'sim');

      await botSay(
        jaEstuda
          ? `E o seu estudo já está <strong>focado ${bancaFrase(c)}</strong> desse concurso?`
          : `Tranquilo — e é justamente aí que a maioria escorrega. O caminho é estudar <strong>focado ${bancaFrase(c)}</strong>, em vez de estudar tudo solto.`,
        1100
      );
      a = await askChips([
        { label: 'Já está direcionado', value: 'sim', icon: 'check' },
        { label: 'Ainda não',           value: 'nao', icon: 'x' },
      ]);
      addUser(a.label); data.q_direcionada = a.label;

      // ── SOLUÇÃO: orientação da equipe + cupom ──
      await botSay(`A nossa equipe pode te ajudar a focar no que <strong>realmente cai ${bancaFrase(c)}</strong> do ${escapeHtml(c.nome)} — e ainda liberar um <strong>cupom exclusivo</strong> pra você.`, 1250);
      await botSay('Quer aproveitar?', 850);
      a = await askChips([
        { label: 'Quero sim',   value: 'sim',  icon: 'sparkles' },
        { label: 'Pode chamar', value: 'sim2', icon: 'arrow-right' },
      ]);
      addUser(a.label); data.q_interesse = a.label;

      // ── PONTE: pedir os dados como consequência lógica do "sim" ──
      const primeiro = data.nome.split(' ')[0];
      await botSay(`Combinado, <strong>${escapeHtml(primeiro)}</strong>! Vou garantir o seu <strong>cupom exclusivo do ${escapeHtml(c.nome)}</strong> e o contato com a nossa equipe. Me passa só mais dois dados 👇`, 1250);
      await askTelefone();
    }

    async function askTelefone() {
      await botSay('Qual o seu <strong>WhatsApp</strong>? É por lá que a nossa equipe fala com você e libera o cupom.', 900);
      showInput({
        type: 'tel',
        phone: true,
        placeholder: '(11) 90000-0000',
        onSubmit: async (v) => {
          const digits = phoneDigits(v);
          if (digits.length < 8) {
            await botSay('O número informado parece incompleto. Confira o DDD e o número, por favor.', 650);
            return;
          }
          data.telefone = '+' + country.value + digits;
          addUser('+' + country.value + ' ' + v);
          hideInputs();
          await askEmail();
        }
      });
    }

    async function askEmail() {
      await botSay('E o seu melhor <strong>e-mail</strong>, pra registrar o seu contato.', 900);
      showInput({
        type: 'email',
        placeholder: 'seu@email.com',
        onSubmit: async (v) => {
          if (!isEmail(v)) {
            await botSay('O e-mail informado não parece válido. Por favor, confira.', 650);
            return;
          }
          data.email = v;
          addUser(v);
          hideInputs();
          await finish();
        }
      });
    }

    async function finish() {
      // dispara o lead (Meta Pixel + webhook) assim que os dados estão completos
      fireMetaLead();
      sendWebhook();

      await botSay('Recebemos as suas informações. Confira abaixo se estão corretas:', 950);

      const m = document.createElement('div');
      m.className = 'msg bot';
      m.innerHTML = `
        <div class="summary">
          <div class="summary-row"><i data-lucide="user"></i><span><b>${escapeHtml(data.nome)}</b></span></div>
          <div class="summary-row"><i data-lucide="briefcase"></i><span>${escapeHtml(data.concurso)}</span></div>
          <div class="summary-row"><i data-lucide="map-pin"></i><span>${escapeHtml(data.estado)}</span></div>
          <div class="summary-row"><i data-lucide="phone"></i><span>${escapeHtml(data.telefone)}</span></div>
          <div class="summary-row"><i data-lucide="mail"></i><span>${escapeHtml(data.email)}</span></div>
        </div>`;
      log.appendChild(m);
      lucide.createIcons();
      scrollDown();

      await botSay(`Tudo certo, ${escapeHtml(data.nome.split(' ')[0])}! Liberamos o seu <strong>cupom exclusivo do ${escapeHtml(data.concurso)}</strong>. 🎟️`, 1100);

      // monta o link do WhatsApp com a mensagem padrão (já com o nome do concurso)
      const msg = `Olá! Recebi um anúncio sobre o concurso ${data.concurso} e tenho interesse em mais informações. Poderia me ajudar?`;
      const waLink = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(msg)}`;

      const cupomEl = document.createElement('div');
      cupomEl.className = 'msg bot';
      cupomEl.innerHTML = `
        <div class="coupon">
          <span class="coupon-tag">Cupom exclusivo</span>
          <div class="coupon-title">${escapeHtml(data.concurso)}</div>
          <div class="coupon-sub">Clique abaixo pra <strong>resgatar o cupom</strong> com a nossa equipe no WhatsApp. <strong>Válido por tempo limitado.</strong></div>
          <span class="coupon-code"><i data-lucide="ticket"></i>${escapeHtml(data.cupom)}</span>
          <a class="cta-link" href="${waLink}" target="_blank" rel="noopener">
            <i data-lucide="message-circle"></i>Resgatar cupom no WhatsApp
          </a>
        </div>`;
      log.appendChild(cupomEl);
      lucide.createIcons();
      scrollDown();
    }

    /* ─── Meta Ads: evento de Lead ─── */
    function fireMetaLead() {
      try {
        if (typeof fbq === 'function') {
          fbq('track', 'Lead', {
            content_name: 'Concurso - ' + data.concurso,
            content_category: data.estado
          });
        }
      } catch (err) {
        console.error('Meta Pixel error:', err);
      }
    }

    /* ─── Webhook: envia nome, email, telefone, estado, concurso, cupom ─── */
    async function sendWebhook() {
      const now = new Date();
      const payload = {
        formulario: FORMULARIO,
        nome: data.nome,
        email: data.email,
        telefone: data.telefone,
        estado: data.estado,
        sigla_estado: data.sigla,
        regiao: 'Sudeste',
        concurso: data.concurso,
        concurso_id: data.concurso_id,
        cupom: data.cupom,
        q_remuneracao: data.q_remuneracao,
        q_preparo: data.q_preparo,
        q_direcionada: data.q_direcionada,
        q_interesse: data.q_interesse,
        origem: 'Chat captura OdonConcursos - Sudeste (cupom)',
        data_contato: now.toISOString(),
        data_contato_br: now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR'),
        ...tracking
      };
      try {
        if (WEBHOOK_URL) {
          await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } else {
          console.log('Lead (configure WEBHOOK_URL):', payload);
        }
      } catch (err) {
        console.error('Webhook error:', err);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
      ));
    }

    start();
  </script>

</body>
</html>
